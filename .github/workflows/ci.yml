# CI pipeline for mod-users monorepo.
#
# Triggers on pushes to main and pull requests. Runs a fast pin-verification
# gate (pins), lint, unit tests, migration validation, a Go/GUI build, and a
# local (no-push) container image build.
#
# --- Multi-repo layout (constraint C2) and private-repo credential (F3) ---
# mod-users is one of several sibling repos in the moduleforge aggregate.
# There is no committed go.work, so api/go.mod's `replace` directives only
# resolve once mod-core, mod-audit, and mod-authz are checked out as
# siblings on disk. Every sibling-consuming job (pins, lint, test,
# migrate-check, build, image) checks out mod-users itself with
# `path: mod-users`, then runs `./scripts/checkout-deps.sh`, which
# materializes (--pinned) or verifies (--verify --remote --strict, in the
# pins job) every sibling pinned in mod-users/versions.lock.yaml -- the same
# script a contributor runs on a bare machine to reproduce this layout
# locally. The sibling repos are private, so every materializer/verify step
# is credentialed via the MODULEFORGE_READ_PAT organization secret, injected
# only through `env:`, never interpolated into a `run:` string. See
# docs/mf-standards/versions-lockfile.md for why this multi-repo checkout
# exists, how the pinning mechanism works, and the credential's scope and
# expiry -- this file does not restate that rationale. See
# app-mftodo/.github/workflows/ci.yml for the sibling consumer this pattern
# was first proven on.
#
# Security: This workflow does not interpolate any user-controlled inputs
# (issue titles, PR bodies, commit messages, etc.) into run: commands. The
# MODULEFORGE_READ_PAT credential above is injected only via env:, never
# interpolated into a run: string.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  SQLC_VERSION: "1.28.0"
  BUN_VERSION: "1.3.4"

jobs:
  pins:
    name: Verify pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { path: mod-users }

      - name: Verify every pin resolves on its remote
        working-directory: mod-users
        env:
          MODULEFORGE_READ_TOKEN: ${{ secrets.MODULEFORGE_READ_PAT }}
        run: ./scripts/checkout-deps.sh --verify --remote --strict

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { path: mod-users }

      - name: Materialize pinned siblings
        working-directory: mod-users
        env:
          MODULEFORGE_READ_TOKEN: ${{ secrets.MODULEFORGE_READ_PAT }}
        run: ./scripts/checkout-deps.sh --pinned

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # --- GUI dependency mechanism decision (go-module-ci-pinning plan, phase 6 task 2) ---
      # CHOSEN: converge mod-users onto a mod-users-rooted bun workspace. mod-users/
      # package.json's "workspaces" array now includes "../mod-core/gui" alongside the
      # existing "gui" member, so bun resolves gui/'s @moduleforge/core-gui peer
      # dependency directly against the workspace member -- no registry round-trip, no
      # gitignored .yalc/ store in the resolution path. This is the same structural fix
      # Phase 5 verified for app-mftodo (plan/notes/gui-dependency-resolution-research.md);
      # mod-core is mod-users' only GUI sibling (unlike app-mftodo/gui, mod-users/gui does
      # not import tags-gui/tasks-gui/users-gui), and mod-core already lands as a sibling
      # here via the materializer above, for this exact reason. A workspace member that is
      # itself a workspace root -- mod-users already declared "workspaces": ["gui"] before
      # this change -- composes correctly (bun resolves the *nearest* root walking up from
      # a member; verified, research note Q1(d)). mod-users/bun.lock -- the workspace
      # root's own lockfile, already committed for the "gui" member -- is regenerated by
      # this task to also freeze "../mod-core/gui" as a member, so --frozen-lockfile
      # fails loudly on drift for either. (The plan task doc names the artifact
      # "mod-users/gui/bun.lock"; verified empirically that `bun install` from the
      # workspace root always writes the lockfile at the *root*, mod-users/bun.lock --
      # there is no nested gui/bun.lock in this shape, since mod-users is itself the
      # workspace root, unlike app-mftodo/gui's member position in Phase 5's design.)
      #
      # REJECTED, keep the yalc chain as-is: would leave mod-users carrying the second,
      # divergent GUI-resolution code path Phase 5 eliminated for app-mftodo, for no
      # remaining benefit -- the single-sibling conversion is cheap and already verified
      # against this exact member-is-a-root shape.
      # REJECTED, drop the GUI steps from lint/build entirely: verified empirically, not
      # assumed -- a `bun install` with no core-gui resolution (core-gui is only an
      # *optional* peer dependency, so bare install succeeds) still leaves `make
      # lint.gui`/`make build.gui` failing. `gui/src` imports @moduleforge/core-gui
      # directly in a dozen-plus files (sidebar-nav, ui/dialog, error-message, auth-page,
      # login-form, register-form, forgot/reset-password pages, email-code-page,
      # oidc-callback-page, lib/api.ts -- not just the three a prior CLAUDE.md gotcha note
      # named): `tsc --noEmit` reports TS2307 on every one of them, and tsup's DTS build
      # step fails outright without core-gui's type declarations resolvable.
      #
      # mod-core lands as a sibling of mod-users (materialized above), not nested under
      # it, so the `cd mod-core/gui` step below deliberately has no working-directory
      # override -- it resolves relative to the job's default $GITHUB_WORKSPACE, the
      # aggregate root both mod-users/ and mod-core/ sit under.
      - name: Install workspace dependencies (mod-core/gui is now a workspace member)
        working-directory: mod-users
        run: bun install --frozen-lockfile

      - name: Build core-gui (workspace sibling; not bare tsup -- dist/index.css requires
          the build:css step)
        run: |
          cd mod-core/gui
          bun run build

      - name: Lint (all sub-projects)
        working-directory: mod-users
        env:
          SHADOW_DB_PREREQ_DIRS: ${{ github.workspace }}/mod-core/model/migrations
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { path: mod-users }

      - name: Materialize pinned siblings
        working-directory: mod-users
        env:
          MODULEFORGE_READ_TOKEN: ${{ secrets.MODULEFORGE_READ_PAT }}
        run: ./scripts/checkout-deps.sh --pinned

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: mod-users
        run: bun install --frozen-lockfile

      # api/go.mod's six replace directives (mod-core, mod-audit, mod-authz) mean `go
      # test ./...` cannot even compile without all three siblings materialized above --
      # confirmed empirically against a real (non-worktree) checkout during this task:
      # `go vet ./...`/`go test ./...` fail at package-load time on the unresolved
      # replace paths with only mod-core present, and succeed once all three are.
      - name: Unit tests
        working-directory: mod-users
        run: make test.unit

  migrate-check:
    name: Validate migrations
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { path: mod-users }

      - name: Materialize pinned siblings
        working-directory: mod-users
        env:
          MODULEFORGE_READ_TOKEN: ${{ secrets.MODULEFORGE_READ_PAT }}
        run: ./scripts/checkout-deps.sh --pinned

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Validate migration directory
        working-directory: mod-users
        run: goose -dir model/migrations/sql validate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: pins
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { path: mod-users }

      - name: Materialize pinned siblings
        working-directory: mod-users
        env:
          MODULEFORGE_READ_TOKEN: ${{ secrets.MODULEFORGE_READ_PAT }}
        run: ./scripts/checkout-deps.sh --pinned

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # GUI dependency mechanism: mod-users converges onto a mod-users-rooted bun
      # workspace (mod-core/gui as a workspace member); see the lint job's identical
      # step above for the full decision record (chosen option, why, and what was
      # rejected). mod-core is a sibling checkout here, not nested under mod-users, so
      # the `cd mod-core/gui` step below deliberately has no working-directory override.
      - name: Install workspace dependencies (mod-core/gui is now a workspace member)
        working-directory: mod-users
        run: bun install --frozen-lockfile

      - name: Build core-gui (workspace sibling; not bare tsup -- dist/index.css requires
          the build:css step)
        run: |
          cd mod-core/gui
          bun run build

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${{ env.SQLC_VERSION }}

      - name: Generate model code
        working-directory: mod-users
        run: make build.model

      - name: Build API
        working-directory: mod-users
        run: make build.api

      - name: Build GUI
        working-directory: mod-users
        run: make build.gui

  image:
    name: Container image (ko)
    runs-on: ubuntu-latest
    needs: [build, pins]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { path: mod-users }

      - name: Materialize pinned siblings
        working-directory: mod-users
        env:
          MODULEFORGE_READ_TOKEN: ${{ secrets.MODULEFORGE_READ_PAT }}
        run: ./scripts/checkout-deps.sh --pinned

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install ko
        run: go install github.com/google/ko@latest

      # `make image.build` is the existing Makefile target (no prerequisite chain) and
      # already sets KO_DOCKER_REPO=ko.local itself -- invoking it here, rather than
      # re-deriving the ko command in the workflow, keeps this job and `make image.build`
      # from drifting apart, matching the anti-drift discipline app-mftodo's `image` job
      # already uses deliberately for the same reason.
      - name: Build image (local only, no push)
        working-directory: mod-users
        run: make image.build
