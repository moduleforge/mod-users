module: users
goModule: github.com/moduleforge/mod-users/api

go:
  api:
    modulePath: github.com/moduleforge/mod-users/api
    dir: ./api
  model:
    modulePath: github.com/moduleforge/mod-users/model
    dir: ./model

migrations:
  range:
    first: 100
    last: 199
  after:
    - core

provides:
  services:
    # localAuthz.New — grants-table authorizer; implements coreAuthz.Authorizer.
    # Depends on authz DB queries, the operation registry (from authz-module),
    # and the pool for wildcard-grant checks.
    - name: authorizer
      type: "*localAuthz.Authorizer"
      constructor: localAuthz.New
      args:
        - queries:authzdb            # authzdb.New(pool)
        - infra:opReg                # *authzapi.OperationRegistry — infra singleton from app manifest
        - infra:pool                 # *pgxpool.Pool (wildcard-grant check)

    # oauthOrchestrator manages OIDC provider onboarding / discovery.
    - name: oauthOrchestrator
      type: "*auth.OAuth"
      constructor: auth.NewOAuth
      returnsError: true
      args:
        - context                # context.Context — startup-time OIDC discovery I/O
        - infra:cfg              # *config.Config

    # JWT token verifier — validates locally-minted Bearer tokens on every request.
    - name: verifier
      type: "*auth.Verifier"
      constructor: auth.NewVerifier
      returnsError: true
      args:
        - context
        - expr:""                     # issuerURL — empty for local-only mode
        - expr:""                     # clientID — empty for local-only mode
        - field:cfg.LocalAuth.JWTSecret
        - field:cfg.LocalAuth.LocalIssuer

    # claimMapper turns JWT claims into a Principal for RequireAuth middleware.
    # The public auth.NewClaimMapper wrapper converts config.AuthConfig to MapperOptions.
    - name: claimMapper
      type: "auth.ClaimMapper"
      constructor: auth.NewClaimMapper
      returnsError: true
      args:
        - expr:"generic"         # mapperStyle hardcoded for demo deployment
        - field:cfg.Auth         # config.AuthConfig — public wrapper maps to MapperOptions

    # userResolver resolves a JWT Principal to an internal UserAccount / entity.
    # Receives observerGroup directly (it is declared before non-observer services).
    - name: userResolver
      type: "*auth.UserResolver"
      constructor: auth.NewUserResolver
      args:
        - infra:pool
        - queries:usersdb  # *db.Queries (users-module model)
        - queries:coredb   # *coredb.Queries
        - field:cfg.Auth.AdminRole
        - field:cfg.LocalAuth.LocalIssuer
        - service:observerGroup  # *observer.ObserverGroup — declared before non-observer services

    # UserAccountService — manages user account CRUD and delegates mutation events
    # to the observer group.
    - name: userAccountService
      type: "*usersservice.UserAccountService"
      constructor: usersservice.NewUserAccountService
      args:
        - infra:pool
        - queries:usersdb            # db.Querier
        - queries:coredb             # coredb.Querier
        - service:authorizer         # coreAuthz.Authorizer
        - service:observerGroup      # *observer.ObserverGroup (reserved — assembled by compiler)
        - service:naturalPersonService  # coreservice.NaturalPersonServicer from core-module
        - service:typeResolver       # *types.Resolver from core-module
        - symbol:auth.HashPassword   # func(plain string)(string, error) — passed as value

    # onboardingHandler — OIDCConfigHandler; owns the oidc_config row and BootState.
    # Consumed by requireOIDCConfirmed middleware and the /v1/oidc-config route group.
    # The public handlers.NewOIDCConfigHandler wrapper constructs OIDCConfigDeps internally.
    # envNoOIDCEnv/adminChecker are the two trailing args added by the Phase 02
    # onboarding-boot-helpers task; neither app has an admin-checker concept yet,
    # so adminChecker is always expr:nil here.
    - name: onboardingHandler
      type: "*handlers.OIDCConfigHandler"
      constructor: handlers.NewOIDCConfigHandler
      args:
        - queries:usersdb
        - service:oauthOrchestrator
        - field:cfg.Providers
        - field:cfg.Onboarding.TokenDisplay
        - expr:oauthOrchestrator.EnvNoOIDCAccounts()
        - expr:nil

    # authHandler — local auth and OIDC callback handler; serves /v1/auth/*.
    # smtp infra singleton satisfies the email.Sender interface.
    - name: authHandler
      type: "*authhandlers.Handler"
      constructor: authhandlers.New
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - field:cfg.LocalAuth.JWTSecret
        - field:cfg.LocalAuth.LocalIssuer
        - infra:smtp                 # *email.SMTPSender — satisfies email.Sender interface
        - field:cfg.Server.GUIBaseURL

    # assumeHandler — assume-identity handler; serves assume routes under /v1.
    # Depends on userAccountService for identity switching and cfg for JWT signing.
    - name: assumeHandler
      type: "*handlers.AssumeHandler"
      constructor: handlers.NewAssumeHandler
      args:
        - service:userAccountService
        - field:cfg.LocalAuth.JWTSecret
        - field:cfg.LocalAuth.LocalIssuer

    # appsHandler — apps/user-accounts membership handler; serves the
    # /v1/apps/{uuid}/user-accounts routes. Top-level /apps CRUD lives in
    # mod-core. Depends on authorizer and observerGroup in addition to pool
    # and queries:usersdb; entityResolver + queries:coredb resolve the
    # {uuid} path param to the app's internal id (mod-users no longer has
    # its own apps query).
    - name: appsHandler
      type: "*handlers.AppsHandler"
      constructor: handlers.NewAppsHandler
      args:
        - infra:pool
        - queries:usersdb
        - service:authorizer
        - service:observerGroup
        - service:entityResolver
        - queries:coredb              # *coredb.Queries

    # oidcHandler — OIDC callback and token-exchange handler; serves /v1/auth OIDC routes.
    # Depends on userResolver, userAccountService, oauthOrchestrator, and observerGroup.
    - name: oidcHandler
      type: "*authhandlers.OIDCHandler"
      constructor: authhandlers.NewOIDCHandler
      args:
        - infra:pool
        - queries:usersdb
        - service:oauthOrchestrator
        - service:userResolver
        - service:userAccountService
        - infra:cfg
        - service:observerGroup

    # providersHandler — OIDC provider CRUD handler; serves /v1/oidc-config provider routes.
    # Depends on oauthOrchestrator and onboardingHandler (as Confirmer).
    - name: providersHandler
      type: "*handlers.ProvidersHandler"
      constructor: handlers.NewProvidersHandler
      args:
        - queries:usersdb
        - service:oauthOrchestrator
        - field:cfg.Providers
        - field:cfg.Auth.OAuthRedirectBaseURL
        - service:onboardingHandler

    # usersHandler — user account management handler; serves /v1/user-accounts/*.
    # grantAdmin/revokeAdmin are composition-root closures defined in the app manifest.
    - name: usersHandler
      type: "*handlers.UserAccountsHandler"
      constructor: handlers.NewUserAccountsHandler
      args:
        - service:userAccountService
        - closure:grantAdminFn       # handlers.GrantAdminFn — defined in app manifest closures
        - closure:revokeAdminFn      # handlers.GrantAdminFn — defined in app manifest closures

    # selfHandler — /v1/self profile read/update handler. Composite identity
    # endpoint: core-module owns entity data (given/family name) via
    # coreServices.Entity.GetSelf; users-module owns the account row (email,
    # timestamps, uuid). Depends on both query sets plus the core services aggregate.
    - name: selfHandler
      type: "*handlers.SelfHandler"
      constructor: handlers.NewSelfHandler
      args:
        - queries:usersdb            # *db.Queries
        - queries:coredb             # *coredb.Queries
        - service:coreServices       # *coreservice.Services (from mod-core)

  routes:
    # REMINDER when adding a route entry here: every `constructor:`/`register:`
    # symbol below must also be re-exported (type alias + thin wrapper func)
    # through the public facade api/handlers/handlers.go. mfgen-generated host
    # apps import that facade package, not api/internal/handlers directly, so
    # a manifest-only addition compiles fine in this repo but breaks every
    # consuming app's `mfgen generate` output. See AGENTS.md's Conventions
    # section for the full explanation and the self-route-manifest incident
    # (2026-07-15) this note is here because of.
    # /v1/auth — local login, register, email-code, password-reset, OIDC callback.
    - prefix: /v1/auth
      scope: public             # unauthenticated — bearer token not yet issued
      handler: authHandler
      constructor: authhandlers.New
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - field:cfg.LocalAuth.JWTSecret
        - field:cfg.LocalAuth.LocalIssuer
        - infra:smtp
        - field:cfg.Server.GUIBaseURL
      register: authhandlers.RegisterRoutes
      register_args:
        - service:oidcHandler
      middleware:
        - requireOIDCConfirmed

    # /v1/oidc-config — OIDC onboarding discovery and setup token endpoints.
    # NOTE: constructor/args below are informational only — the resolver skips
    # handler-node creation here because provides.services.onboardingHandler
    # (above) is the canonical construction site for this same-named handler.
    # Kept in sync with that entry to avoid documentation drift.
    - prefix: /v1/oidc-config
      scope: public             # unauthenticated — OIDC onboarding precedes auth
      handler: onboardingHandler
      constructor: handlers.NewOIDCConfigHandler
      args:
        - queries:usersdb
        - service:oauthOrchestrator
        - field:cfg.Providers
        - field:cfg.Onboarding.TokenDisplay
        - expr:oauthOrchestrator.EnvNoOIDCAccounts()
        - expr:nil
      register: handlers.RegisterOIDCConfigRoutes
      register_args:
        - service:providersHandler

    # /v1 (account routes) — user-accounts CRUD, assume-identity, and apps/user-accounts.
    - prefix: /v1
      handler: usersHandler
      register: handlers.RegisterAccountRoutes
      register_args:
        - service:assumeHandler
        - service:appsHandler
      middleware:
        - requireOIDCConfirmed
        - requireAuth
        - requireVerifiedEmail

    # /v1/self (GET) — read own profile. Reachable to accounts with UNVERIFIED
    # email (so the GUI can render the "verify your email" page). Matches this
    # file's standard convention: differentiation via each entry's own
    # middleware: list, not a register-arg.
    - prefix: /v1
      handler: selfHandler
      register: handlers.RegisterSelfGetRoute
      middleware:
        - requireOIDCConfirmed
        - requireAuth

    # /v1/self (PUT) — update own profile. Requires a verified email.
    - prefix: /v1
      handler: selfHandler
      register: handlers.RegisterSelfPutRoute
      middleware:
        - requireOIDCConfirmed
        - requireAuth
        - requireVerifiedEmail

  middleware:
    # requireAuth validates the Bearer token and sets the Principal in the request context.
    - name: requireAuth
      constructor: auth.RequireAuth
      args:
        - service:verifier
        - service:claimMapper
        - service:userResolver

    # requireVerifiedEmail gates routes to accounts with completed email verification.
    # NewRequireVerifiedEmail() returns RequireVerifiedEmail as a chi.Middleware value.
    - name: requireVerifiedEmail
      constructor: auth.NewRequireVerifiedEmail
      args: []

    # requireOIDCConfirmed gates all /v1/* routes behind the OIDC boot-state check.
    - name: requireOIDCConfirmed
      constructor: auth.RequireOIDCConfirmed
      args:
        - method:onboardingHandler.CurrentState

hooks:
  # firstUserGrant bootstraps the wildcard manage grant for the first created user.
  firstUserGrant:
    symbol: users.NewFirstUserHook
    args:
      - infra:pool                   # *pgxpool.Pool
      - service:grantService         # GrantServicer from authz-module
    registeredOn:
      - method:userResolver.SetFirstUserHook
      - method:authHandler.SetFirstUserHook

requires:
  services:
    - name: naturalPersonService   # coreservice.NaturalPersonServicer from core-module
    - name: typeResolver           # *types.Resolver from core-module
    - name: coreServices           # *coreservice.Services from core-module
    - name: grantService           # GrantServicer from authz-module
    - name: entityResolver         # *entity.Resolver from core-module — resolves apps.{uuid} to internal id
    # operationRegistry moved to requires.infra as opReg (infra singleton in app manifest)
    # grantAdminFn/revokeAdminFn: composition-root closures; deferred to phase-4 compiler (JEDl)
  infra:
    - name: pool                   # *pgxpool.Pool
    - name: opReg                  # *authzapi.OperationRegistry — infra singleton
    - name: smtp                   # *email.SMTPSender — email infra singleton from app manifest
    - name: cfg                    # *config.Config

gui:
  package: "@moduleforge/users-gui"
  dir: ./gui
  peers:
    - "@moduleforge/core-gui"

openapi:
  role: host
  path: ./api/openapi.yaml
