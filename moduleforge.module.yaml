module: users
goModule: github.com/moduleforge/mod-users/api

go:
  api:
    modulePath: github.com/moduleforge/mod-users/api
    dir: ./api
  model:
    modulePath: github.com/moduleforge/mod-users/model
    dir: ./model

migrations:
  range:
    first: 100
    last: 199
  after:
    - core

provides:
  services:
    # localAuthz.New — grants-table authorizer; implements coreAuthz.Authorizer.
    # Depends on authz DB queries, the operation registry (from authz-module),
    # and the pool for wildcard-grant checks.
    - name: authorizer
      type: "*localAuthz.Authorizer"
      constructor: localAuthz.New
      args:
        - queries:authzdb            # authzdb.New(pool)
        - infra:opReg                # *authzapi.OperationRegistry — infra singleton from app manifest
        - infra:pool                 # *pgxpool.Pool (wildcard-grant check)

    # oauthOrchestrator manages OIDC provider onboarding / discovery.
    - name: oauthOrchestrator
      type: "*auth.OAuth"
      constructor: auth.NewOAuth
      returnsError: true
      args:
        - context                # context.Context — startup-time OIDC discovery I/O
        - infra:cfg              # *config.Config

    # verifier — validates locally-minted EdDSA Bearer tokens (the public half
    # of the signing key plus any JWT_VERIFY_PUBLIC_KEYS).
    - name: verifier
      type: "*auth.Verifier"
      constructor: auth.NewLocalVerifier
      returnsError: true
      args:
        - context
        - field:cfg.LocalAuth

    # authenticator — authenticates a bearer access token with per-request
    # liveness: one database round trip re-checks the session or credential
    # and the acting profile. Consumed by requireAuth and resolveOrAnonymous.
    # The authorizer evaluates the invite-only app gate (login on the app) in
    # the same check.
    - name: authenticator
      type: "*auth.Authenticator"
      constructor: auth.NewAuthenticatorWithAppGate
      args:
        - infra:pool
        - service:verifier
        - field:cfg.Auth
        - service:authorizer

    # signer — signs this module's EdDSA access tokens.
    - name: signer
      type: "*auth.Signer"
      constructor: auth.NewSigner
      returnsError: true
      args:
        - field:cfg.LocalAuth

    # anonymousActor — the shared, zero-authority anonymous system actor.
    # Resolved once at startup by slug (system_actors.slug = 'anonymous',
    # seeded by migration 0100_baseline.sql); NewAnonymousActor asserts
    # at boot that the actor holds zero grants and refuses to start if it
    # finds any. Consumed only by resolveOrAnonymous below — this
    # service entry has no other consumer.
    #
    # provides.middleware nodes are unconditional reachability roots in
    # mfgen (internal/resolver/reachability.go), so resolveActorOrAnonymous
    # — and therefore this service — is constructed in *every* consuming
    # app's composition root, whether or not that app uses the middleware.
    # That means every consuming app now hard-fails at boot if this module's
    # 0100_baseline.sql has not been applied. This is intentional
    # fail-fast design, and it is safe because generated composition roots
    # run all module migrations before constructing services.
    - name: anonymousActor
      type: "*auth.AnonymousActor"
      constructor: auth.NewAnonymousActor
      returnsError: true
      args:
        - context
        - infra:pool

    # challengeService — issues and verifies the emailed one-time codes and the
    # one-time login handoffs. infra:smtp satisfies the email.Sender interface.
    - name: challengeService
      type: "*usersservice.ChallengeService"
      constructor: usersservice.NewChallengeService
      args:
        - queries:usersdb
        - infra:smtp

    # credentialService — password, SSH key, OIDC, API key, email code and
    # anonymous credentials.
    - name: credentialService
      type: "*usersservice.CredentialService"
      constructor: usersservice.NewCredentialService
      args:
        - queries:usersdb
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - symbol:auth.HashPassword   # func(plain string)(string, error) — passed as value

    # sessionService — sessions, refresh tokens, sign-in flows and step-up.
    - name: sessionService
      type: "*usersservice.SessionService"
      constructor: usersservice.NewSessionService
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:signer
        - service:challengeService
        - expr:usersservice.SessionConfigFrom(cfg)

    # impersonationService — impersonation as a child session of the
    # administrator's own (/v1/impersonations): a recorded reason, a lifetime
    # capped by AUTH_IMPERSONATION_TTL and AUTH_IMPERSONATION_MAX (carried by
    # sessionService's SessionConfig), a fresh-authentication requirement (the
    # authorizer's `impersonate` gate), no nesting, and the real administrator
    # always recorded. Observations: `impersonate`, `update` and `revoke` on
    # resource `impersonation`.
    - name: impersonationService
      type: "*usersservice.ImpersonationService"
      constructor: usersservice.NewImpersonationService
      args:
        - infra:pool
        - queries:usersdb
        - service:authorizer
        - service:observerGroup
        - service:sessionService

    # userService — user creation and the /v1/me and /v1/principals operations.
    # NewUserServiceWithSelfService is NewUserService followed by
    # UserService.WithSelfService (pool, sessions, challenges, op resolver and
    # AUTH_SELF_SERVICE_MAX_AUTH_AGE). It also registers the user and profile
    # display renderers (U19) on the shared displayRegistry from core-module;
    # this is the manifest's only path to RegisterDisplayRenderers, and
    # userService is reachable through the /v1/me and /v1/principals handlers.
    - name: userService
      type: "*usersservice.UserService"
      constructor: usersservice.NewUserServiceWithSelfService
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:naturalPersonService  # coreservice.NaturalPersonServicer from core-module
        - service:credentialService
        - service:sessionService
        - service:challengeService
        - infra:opReg                   # *authzapi.OperationRegistry — op resolver
        - field:cfg.Auth.SelfServiceMaxAuthAge
        - service:displayRegistry       # *display.Registry from core-module

    # profileService — the party profile lifecycle: invitations, acceptance,
    # suspension, resumption and ending (with departure cleanup), managed users
    # and the lifecycle observers other modules subscribe to
    # (AddLifecycleObserver, in-transaction).
    - name: profileService
      type: "*usersservice.ProfileService"
      constructor: usersservice.NewProfileService
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:userService
        - service:credentialService
        - service:sessionService

    # partyPolicyService — how a party gates its profiles: the authentication
    # policy (/v1/parties/{party_uuid}/authn-policy), the credentials authorized
    # for it (/credential-authorizations) and those confined to it
    # (/confinements).
    - name: partyPolicyService
      type: "*usersservice.PartyPolicyService"
      constructor: usersservice.NewPartyPolicyService
      args:
        - infra:pool
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:userService

    # personalPartyService — EnsurePersonalParty, the Go API mod-billing calls
    # for personal team plans: it idempotently gives the acting user their own
    # natural_person party and an owned-scope manage grant over it, in the
    # caller's transaction. It has no HTTP route.
    - name: personalPartyService
      type: "*usersservice.PersonalPartyService"
      constructor: usersservice.NewPersonalPartyService
      args:
        - service:observerGroup

    # collaboratorGate — the outside-collaborator check mod-authz consults when
    # a profile outside a party's own is added to the party's actor group or
    # named as a grant actor: it compares the profile holder's credentials with
    # the party's authentication policy and records the caller's confirmation of
    # a mismatch (profile_policy_confirmations). mod-authz's manifest consumes it
    # as optionalService:collaboratorGate and matches it structurally; it holds
    # no state and needs no arguments.
    - name: collaboratorGate
      type: "*usersservice.CollaboratorGate"
      constructor: usersservice.NewCollaboratorGate
      args: []

    # bootstrapService — the first-run bootstrap (POST /v1/bootstrap): in one
    # transaction the first user, the operator party, the admin profile and
    # its wildcard manage grant, the operator party's authentication policy
    # and the landing session, with core_claim_operator_party as the single
    # winner. Also answers the operator-administrator check of the OIDC
    # configuration routes (operatorAdminChecker).
    - name: bootstrapService
      type: "*usersservice.BootstrapService"
      constructor: usersservice.NewBootstrapService
      args:
        - infra:pool
        - service:authorizer
        - service:observerGroup
        - service:userService
        - service:credentialService
        - service:sessionService
        - service:profileService
        - service:bootstrapOrganizationService

    # bootstrapOrganizationService — mod-core's OrganizationService, extracted
    # from the coreServices aggregate (mod-core's manifest provides no
    # organization service of its own). Only bootstrapService consumes it, for
    # the trusted, non-authorizing CreateInTx that creates the operator
    # organization; no handler may take it.
    - name: bootstrapOrganizationService
      type: "coreservice.OrganizationServicer"
      constructor: usersservice.OrganizationFromServices
      args:
        - service:coreServices

    # operatorAdminChecker — the OIDC configuration routes' ambient admin
    # check: a bearer session whose acting profile is an operator profile
    # holding wildcard manage. Without it only the setup token authorizes
    # those routes, and the token is cleared once the bootstrap is done and
    # OIDC is confirmed.
    - name: operatorAdminChecker
      type: "handlers.OperatorAdminCheck"
      constructor: handlers.NewOperatorAdminChecker
      args:
        - service:authenticator
        - service:bootstrapService

    # directoryService — batch display lookups for other modules; does no
    # authorization (callers authorize first).
    - name: directoryService
      type: "*usersservice.DirectoryService"
      constructor: usersservice.NewDirectoryService
      args:
        - infra:pool

    # oidcResolver — decides what a verified external OIDC identity maps to
    # (by issuer and subject credential, never by email).
    - name: oidcResolver
      type: "*auth.OIDCResolver"
      constructor: auth.NewOIDCResolver
      args:
        - queries:usersdb

    # onboardingHandler — OIDCConfigHandler; owns the oidc_config row, BootState
    # and the setup token, which stays active while the bootstrap is pending
    # (platform_settings.operator_party_id NULL) or OIDC is unconfirmed.
    # Consumed by requireOIDCConfirmed middleware, the /v1/oidc-config route
    # group and bootstrapHandler. The public handlers.NewOIDCConfigHandler
    # wrapper constructs OIDCConfigDeps internally. adminChecker is the
    # operator-administrator check; the trailing queries:coredb reads
    # platform_settings.
    - name: onboardingHandler
      type: "*handlers.OIDCConfigHandler"
      constructor: handlers.NewOIDCConfigHandler
      args:
        - queries:usersdb
        - service:oauthOrchestrator
        - field:cfg.Providers
        - field:cfg.Onboarding.TokenDisplay
        - expr:oauthOrchestrator.EnvNoOIDCAccounts()
        - service:operatorAdminChecker
        - queries:coredb

    # authHandler — local auth handler; serves /v1/auth/*.
    # smtp infra singleton satisfies the authhandlers.Sender interface.
    - name: authHandler
      type: "*authhandlers.Handler"
      constructor: authhandlers.New
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - service:userService
        - service:credentialService
        - service:challengeService
        - service:sessionService
        - service:oauthOrchestrator
        - infra:smtp                 # *email.SMTPSender — satisfies authhandlers.Sender
        - field:cfg.Server.GUIBaseURL

    # oidcHandler — OIDC sign-in start and callback (/v1/auth), plus the link
    # start (/v1/me) and the step-up start (/v1/session).
    - name: oidcHandler
      type: "*authhandlers.OIDCHandler"
      constructor: authhandlers.NewOIDCHandler
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - service:oauthOrchestrator
        - service:oidcResolver
        - service:userService
        - service:credentialService
        - service:challengeService
        - service:sessionService
        - service:observerGroup
        - infra:cfg

    # providersHandler — OIDC provider CRUD handler; serves /v1/oidc-config provider routes.
    # Depends on oauthOrchestrator and onboardingHandler (as Confirmer); the
    # core queries resolve a provider's party_uuid.
    - name: providersHandler
      type: "*handlers.ProvidersHandler"
      constructor: handlers.NewProvidersHandler
      args:
        - queries:usersdb
        - service:oauthOrchestrator
        - field:cfg.Providers
        - field:cfg.Auth.OAuthRedirectBaseURL
        - queries:coredb
        - service:onboardingHandler

    # meHandler — /v1/me: own user, identifiers, credentials, sessions and the
    # holder's profile actions (accept, decline, leave).
    - name: meHandler
      type: "*handlers.MeHandler"
      constructor: handlers.NewMeHandler
      args:
        - service:userService
        - service:profileService

    # sessionHandler — /v1/session: current session, switch, fork, step-up, logout.
    - name: sessionHandler
      type: "*handlers.SessionHandler"
      constructor: handlers.NewSessionHandler
      args:
        - service:sessionService

    # impersonationHandler — /v1/impersonations: start, renew and end.
    - name: impersonationHandler
      type: "*handlers.ImpersonationHandler"
      constructor: handlers.NewImpersonationHandler
      args:
        - service:impersonationService

    # principalsHandler — /v1/principals: list, read, disable and enable.
    - name: principalsHandler
      type: "*handlers.PrincipalsHandler"
      constructor: handlers.NewPrincipalsHandler
      args:
        - service:userService

    # partiesHandler — party administration: /v1/parties/{party_uuid}/profiles,
    # /managed-users, /authn-policy, /credential-authorizations and
    # /confinements, and PATCH /v1/profiles/{uuid}.
    - name: partiesHandler
      type: "*handlers.PartiesHandler"
      constructor: handlers.NewPartiesHandler
      args:
        - service:profileService
        - service:partyPolicyService

    # bootstrapHandler — the public /v1/bootstrap routes (status and the
    # setup-token bootstrap).
    - name: bootstrapHandler
      type: "*handlers.BootstrapHandler"
      constructor: handlers.NewBootstrapHandler
      args:
        - service:bootstrapService
        - service:onboardingHandler

    # sshKeyResolver — resolves a candidate SSH public key to the credential
    # that registered it (docs/architecture/ssh-keys.md D11). A composing app
    # (for example app-mfgit) adapts it into mod-repos' transport.KeyResolver;
    # no mod-users route consumes it directly. It is pre-authentication,
    # read-only, and uncached — see SSHKeyResolver's own doc comment
    # (api/internal/service/ssh_key_resolver.go) for the hard guarantees it
    # upholds. The composing transport must rate-limit handshakes and cap
    # candidate keys per connection, since ResolveCredential runs once per
    # candidate key, including unsigned probes from unauthenticated peers
    # (docs/architecture/ssh-keys.md).
    - name: sshKeyResolver
      type: "*usersservice.SSHKeyResolver"
      constructor: usersservice.NewSSHKeyResolver
      args:
        - queries:usersdb
        - queries:coredb

  routes:
    # REMINDER when adding a route entry here: every `constructor:`/`register:`
    # symbol below must also be re-exported (type alias + thin wrapper func)
    # through the public facade api/handlers/handlers.go. mfgen-generated host
    # apps import that facade package, not api/internal/handlers directly, so
    # a manifest-only addition compiles fine in this repo but breaks every
    # consuming app's `mfgen generate` output. See AGENTS.md's Conventions
    # section for the full explanation and the self-route-manifest incident
    # (2026-07-15) this note is here because of.
    # /v1/auth — local login, register, email-code, password-reset, token
    # refresh, handoff, providers, and the OIDC start and callback.
    # NOTE: constructor/args below are informational only — the resolver skips
    # handler-node creation here because provides.services.authHandler (above)
    # is the canonical construction site for this same-named handler. Kept in
    # sync with that entry to avoid documentation drift (same convention as
    # the /v1/oidc-config entry below).
    - prefix: /v1/auth
      scope: public             # unauthenticated — bearer token not yet issued
      handler: authHandler
      constructor: authhandlers.New
      args:
        - infra:pool
        - queries:usersdb
        - queries:coredb
        - service:userService
        - service:credentialService
        - service:challengeService
        - service:sessionService
        - service:oauthOrchestrator
        - infra:smtp
        - field:cfg.Server.GUIBaseURL
      register: authhandlers.RegisterRoutes
      register_args:
        - service:oidcHandler
      middleware:
        - requireOIDCConfirmed

    # /v1/oidc-config — OIDC onboarding discovery and setup token endpoints.
    # NOTE: constructor/args below are informational only — the resolver skips
    # handler-node creation here because provides.services.onboardingHandler
    # (above) is the canonical construction site for this same-named handler.
    # Kept in sync with that entry to avoid documentation drift.
    - prefix: /v1/oidc-config
      scope: public             # unauthenticated — OIDC onboarding precedes auth
      handler: onboardingHandler
      constructor: handlers.NewOIDCConfigHandler
      args:
        - queries:usersdb
        - service:oauthOrchestrator
        - field:cfg.Providers
        - field:cfg.Onboarding.TokenDisplay
        - expr:oauthOrchestrator.EnvNoOIDCAccounts()
        - service:operatorAdminChecker
        - queries:coredb
      register: handlers.RegisterOIDCConfigRoutes
      register_args:
        - service:providersHandler

    # /v1/bootstrap — first-run bootstrap: GET /status and POST / with the
    # X-Setup-Token header. Public and deliberately NOT behind
    # requireOIDCConfirmed: the bootstrap may precede the OIDC configuration.
    - prefix: /v1/bootstrap
      scope: public             # unauthenticated — the setup token is the credential
      handler: bootstrapHandler
      register: handlers.RegisterBootstrapRoutes

    # /v1/session — current session, switch, fork, step-up (password, email
    # code, OIDC) and logout. Every route is bearer-authenticated.
    # register_args supplies the OIDC handler for the step-up start.
    - prefix: /v1/session
      handler: sessionHandler
      register: handlers.RegisterSessionRoutes
      register_args:
        - service:oidcHandler
      middleware:
        - requireOIDCConfirmed
        - requireAuth

    # /v1/impersonations — start (POST /), renew (POST /current/renew) and end
    # (DELETE /current) an impersonation session. Authorization is enforced at
    # the service layer.
    - prefix: /v1/impersonations
      handler: impersonationHandler
      register: handlers.RegisterImpersonationRoutes
      middleware:
        - requireOIDCConfirmed
        - requireAuth

    # /v1/me — own user, identifiers, credentials (including the OIDC link
    # start), sessions and the holder's profile actions. Reachable to accounts with an UNVERIFIED email (so
    # the GUI can render the "verify your email" page), hence no
    # requireVerifiedEmail.
    - prefix: /v1/me
      handler: meHandler
      register: handlers.RegisterMeRoutes
      register_args:
        - service:oidcHandler
      middleware:
        - requireOIDCConfirmed
        - requireAuth

    # /v1/principals — list, read, disable and enable principals. Authorization
    # is enforced at the service layer.
    - prefix: /v1/principals
      handler: principalsHandler
      register: handlers.RegisterPrincipalRoutes
      middleware:
        - requireOIDCConfirmed
        - requireAuth

    # /v1/parties — a party's profiles (list, invite) and managed users.
    # Authorization is enforced at the service layer; a party the caller may not
    # read is a 404. Later party administration routes (authentication policy,
    # credential authorizations, confinements) register here too.
    - prefix: /v1/parties
      handler: partiesHandler
      register: handlers.RegisterPartyRoutes
      middleware:
        - requireOIDCConfirmed
        - requireAuth

    # /v1/profiles — PATCH /{uuid}: suspend, resume or end a party profile.
    - prefix: /v1/profiles
      handler: partiesHandler
      register: handlers.RegisterProfileRoutes
      middleware:
        - requireOIDCConfirmed
        - requireAuth

  middleware:
    # requireAuth authenticates the Bearer token (per-request session or
    # credential and profile liveness) and installs the Identity and
    # opctx.AuthContext on the request context.
    - name: requireAuth
      constructor: auth.NewRequireAuth
      args:
        - service:authenticator

    # requireVerifiedEmail gates routes to accounts with completed email verification.
    # NewRequireVerifiedEmail() returns RequireVerifiedEmail as a chi.Middleware value.
    - name: requireVerifiedEmail
      constructor: auth.NewRequireVerifiedEmail
      args: []

    # requireOIDCConfirmed gates all /v1/* routes behind the OIDC boot-state check.
    - name: requireOIDCConfirmed
      constructor: auth.RequireOIDCConfirmed
      args:
        - method:onboardingHandler.CurrentState

    # resolveOrAnonymous is opt-in middleware: it behaves exactly like
    # requireAuth except a request presenting no Authorization header at all
    # resolves to the shared, zero-authority anonymousActor instead of being
    # rejected with 401. A presented-but-bad credential is never downgraded —
    # only a genuinely absent header falls through.
    #
    # Consuming modules reference this middleware by name from a
    # scope: public route group's middleware: list, with
    # requireOIDCConfirmed listed first (e.g.
    # middleware: [requireOIDCConfirmed, resolveOrAnonymous]). It must
    # never be combined with requireAuth or requireVerifiedEmail on the same
    # route group: composing with requireAuth is contradictory, and
    # composing with requireVerifiedEmail fails closed with a 500 (no
    # Identity is placed on the anonymous branch).
    #
    # provides.middleware nodes are unconditional reachability roots in
    # mfgen (internal/resolver/reachability.go): this middleware — and
    # therefore the anonymousActor service it depends on — is constructed in
    # every consuming app's composition root whether or not that app opts
    # in, so every consuming app now hard-fails at boot if this module's
    # 0100_baseline.sql has not been applied. See the anonymousActor
    # service entry's comment above for why this is intentional and safe.
    - name: resolveOrAnonymous
      constructor: auth.NewResolveOrAnonymous
      args:
        - service:authenticator
        - service:anonymousActor

requires:
  services:
    - name: naturalPersonService   # coreservice.NaturalPersonServicer from core-module
    - name: displayRegistry        # *display.Registry from core-module
    - name: coreServices           # *coreservice.Services from core-module (bootstrapOrganizationService)
  infra:
    - name: pool                   # *pgxpool.Pool
    - name: opReg                  # *authzapi.OperationRegistry — infra singleton
    - name: smtp                   # *email.SMTPSender — email infra singleton from app manifest
    - name: cfg                    # *config.Config

gui:
  package: "@moduleforge/users-gui"
  dir: ./gui
  peers:
    - "@moduleforge/core-gui"

openapi:
  role: host
  path: ./api/openapi.yaml
