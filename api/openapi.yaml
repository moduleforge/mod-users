  # -- SSH Keys (self) --

  /v1/self/ssh-keys:
    get:
      summary: List the authenticated user's SSH public keys
      description: |
        Lists the caller's own active SSH public keys, ordered by
        registration time. Reachable with an unverified email, matching
        `GET /v1/self/identities` — listing does not require step-up.
      tags: [SSH Keys]
      operationId: listSelfSSHKeys
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of the caller's active SSH keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSSHKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"
    post:
      summary: Register an SSH public key for the authenticated user
      description: |
        Registers a new SSH public key on the caller's own account.
        Requires a verified email. When `AUTH_REQUIRE_STEP_UP` is enabled,
        also requires a valid `X-Step-Up-Token` header; the request fails
        with `409 users.step_up_required` (action-required, not an error)
        when the token is missing or invalid — see the `409` response
        below.

        `public_key` must be a single `authorized_keys`-format line. A line
        carrying `authorized_keys` options (for example `command="..."`,
        `no-pty`), a certificate key type, or more than one key is refused
        with `400` / `users.ssh_key_invalid`. Accepted key types are
        Ed25519, the FIDO `sk-` variants, ECDSA P-256/384/521, and RSA of
        at least 2048 bits; an unsupported type is refused with `400` /
        `users.ssh_key_type_unsupported`, an under-strength RSA key with
        `400` / `users.ssh_key_too_weak`, and a `label` over 100 characters
        with `400` / `users.ssh_key_label_too_long`. A supplied `label`
        containing a control or bidi-formatting character is refused with
        `400` / `users.ssh_key_label_invalid`.
      tags: [SSH Keys]
      operationId: registerSelfSSHKey
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHKeyCreate"
      responses:
        "201":
          description: Key registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/EmailUnverified"
        "409":
          $ref: "#/components/responses/SSHKeyRegisterConflict"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/self/ssh-keys/{key_uuid}:
    delete:
      summary: Revoke one of the authenticated user's SSH public keys
      description: |
        Archives the key; it stops resolving on the caller's next SSH
        connection (an already-open session is not terminated). Requires a
        verified email and, when `AUTH_REQUIRE_STEP_UP` is enabled, a valid
        `X-Step-Up-Token` header; the request fails with `409
        users.step_up_required` (action-required, not an error) when the
        token is missing or invalid — see the `409` response below. Every
        not-found-or-not-permitted outcome — unknown `key_uuid`, a
        `key_uuid` belonging to another account, or an already-revoked key
        — returns the same masked `403`, indistinguishable from a genuine
        permission failure.
      tags: [SSH Keys]
      operationId: revokeSelfSSHKey
      parameters:
        - $ref: "#/components/parameters/KeyUUID"
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "204":
          description: Key revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEmailUnverified"
        "409":
          $ref: "#/components/responses/SSHKeyStepUpRequired"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  # -- SSH Keys (operator) --

  /v1/user-accounts/{uuid}/ssh-keys:
    get:
      summary: List a user's SSH public keys (operator)
      description: |
        Lists the target account's active SSH public keys. Requires a
        verified email on the caller. Uses the `/v1/user-accounts/{uuid}`
        prefix, the prefix this module actually serves
        (`api/internal/handlers/account_routes.go`), unlike the older
        `/v1/users/{user_uuid}` admin paths documented elsewhere in this file.
        Every not-found-or-not-permitted outcome — unknown account UUID, or
        an account the caller may not act on — returns the same masked
        `403`.
      tags: [SSH Keys]
      operationId: listUserAccountSSHKeys
      parameters:
        - $ref: "#/components/parameters/AccountUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of the target account's active SSH keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSSHKeys"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEmailUnverified"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"
    post:
      summary: Register an SSH public key for a user (operator)
      description: |
        Registers a new SSH public key on the target account. Requires a
        verified email on the caller. Step-up-gated exactly like the
        self-service register endpoint above, but **only when `{uuid}`
        names the caller's own account** — a genuine
        operator-on-behalf-of-a-different-account call is not step-up-gated,
        matching every other `/v1/user-accounts/*` admin route. Uses the
        `/v1/user-accounts/{uuid}` prefix, the prefix this module actually
        serves (`api/internal/handlers/account_routes.go`), unlike the older
        `/v1/users/{user_uuid}` admin paths documented elsewhere in this file.
        Every not-found-or-not-permitted outcome — unknown account UUID, or
        an account the caller may not act on — returns the same masked
        `403`.

        `public_key` must be a single `authorized_keys`-format line, subject
        to the same validation as self-registration: options, certificate
        key types, and multiple keys are refused with `400` /
        `users.ssh_key_invalid`; accepted key types are Ed25519, the FIDO
        `sk-` variants, ECDSA P-256/384/521, and RSA of at least 2048 bits
        (otherwise `400` / `users.ssh_key_type_unsupported` or `400` /
        `users.ssh_key_too_weak`); a `label` over 100 characters is refused
        with `400` / `users.ssh_key_label_too_long`, and a `label`
        containing a control or bidi-formatting character is refused with
        `400` / `users.ssh_key_label_invalid`.
      tags: [SSH Keys]
      operationId: registerUserAccountSSHKey
      parameters:
        - $ref: "#/components/parameters/AccountUUID"
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHKeyCreate"
      responses:
        "201":
          description: Key registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEmailUnverified"
        "409":
          $ref: "#/components/responses/SSHKeyRegisterConflict"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/user-accounts/{uuid}/ssh-keys/{key_uuid}:
    delete:
      summary: Revoke a user's SSH public key (operator)
      description: |
        Archives the key; it stops resolving on the account's next SSH
        connection (an already-open session is not terminated). Requires a
        verified email on the caller. Step-up-gated exactly like the
        self-service revoke endpoint above, but **only when `{uuid}`
        names the caller's own account** — a genuine
        operator-on-behalf-of-a-different-account call is not step-up-gated,
        matching every other `/v1/user-accounts/*` admin route. Uses the
        `/v1/user-accounts/{uuid}` prefix, the prefix this module actually
        serves (`api/internal/handlers/account_routes.go`), unlike the older
        `/v1/users/{user_uuid}` admin paths documented elsewhere in this file.
        Every not-found-or-not-permitted outcome — unknown account UUID, an
        account the caller may not act on, unknown `key_uuid`, a
        `key_uuid` belonging to a different account, or an already-revoked
        key — returns the same masked `403`.
      tags: [SSH Keys]
      operationId: revokeUserAccountSSHKey
      parameters:
        - $ref: "#/components/parameters/AccountUUID"
        - $ref: "#/components/parameters/KeyUUID"
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "204":
          description: Key revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEmailUnverified"
        "409":
          $ref: "#/components/responses/SSHKeyStepUpRequired"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"
