openapi: "3.0.3"
info:
  title: Users Module API
  description: |
    REST API for mod-users. Manages user accounts, authentication,
    authorization, application tenancy, and audit logging.
  version: 0.1.0
  contact:
    email: zane@liquid-labs.com

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: SSH Keys
    description: >-
      SSH public keys used for git-over-SSH authentication by composing
      applications.

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtained via any supported auth method (password, email-code,
        Google OIDC, Microsoft OIDC). Pass as `Authorization: Bearer <token>`.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Machine-readable error code, drawn from the reserved top-level vocabulary
            (a closed set so a generic client can branch on it). Finer-grained,
            module-specific distinctions are carried in `details[].code`, namespaced
            by module (e.g. `users.email_taken`) — a module never introduces a new
            top-level code.
          enum:
            - unauthenticated
            - forbidden
            - not_found
            - invalid_input
            - conflict
            - internal_error
          example: invalid_input
        message:
          type: string
          description: Human-readable error description.
          example: "invalid JSON body"
        details:
          type: array
          description: |
            Optional field-level and sub-error breakdown. Omitted (not present, not
            an empty array) when there is no per-field detail.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The input this error binds to (matches a form field name).
          example: email
        code:
          type: string
          description: Namespaced, module-specific detail code (e.g. `users.email_taken`).
          example: users.email_taken
        message:
          type: string
          description: Human-readable, safe-to-display detail message.
          example: "That email is already registered."

    Action:
      type: object
      description: |
        The action-required envelope. A response carrying this shape is a
        third response kind alongside a bare resource body (success) and the
        `Error` envelope: the request was well-formed and the actor
        authenticated, but the client must complete an out-of-band action
        (navigate/redirect the user) before the original operation can
        proceed. It is never returned alongside `Error` on the same
        response, and it MUST NOT be treated as an error (no banner/toast) —
        the client navigates to `path` instead. See
        `docs/mf-standards/architecture/api-response-design.md`, "The
        `action` object".
      required: [code, message, path]
      properties:
        code:
          type: string
          description: |
            Machine-readable, module-namespaced action code drawn from the
            owning module's closed, per-module registry (parallel to how
            `Error.code` documents its reserved enum, except namespaced
            rather than top-level — an action-required response has no
            generic/reserved-core layer). mod-users registers three codes
            today, enumerated below; a module MUST NOT emit an unregistered
            or un-namespaced action code.
          enum:
            - users.email_unverified
            - users.step_up_required
            - users.oidc_not_confirmed
          example: users.email_unverified
        message:
          type: string
          description: |
            Human-readable prompt to act — not an error. Safe to surface to
            an end user; never leaks internal identifiers, stack traces, or
            SQL.
          example: "Verify your email address before continuing."
        path:
          type: string
          description: |
            The application-relative navigation/redirect target the client
            must send the user to in order to complete the out-of-band
            action. Always relative — no scheme, no `//`-prefixed
            authority — never constructed from unvalidated external input.
          example: /verify-email
        data:
          type: object
          description: |
            Kind-specific auxiliary state the destination needs. Omitted
            (not present, not `{}`) when the action needs none. Present only
            for `users.oidc_not_confirmed`, which carries
            `{state: <boot-state>}` — `state` is one of the deployment's
            unconfirmed OIDC boot states (`init_failed`, `no_env_no_flag`;
            see `api/internal/config/oidc_state.go`'s `BootState`).
          example: { state: "no_env_no_flag" }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        db:
          type: string

    UserSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        email_verified:
          type: boolean
        is_admin:
          type: boolean
        is_anonymous:
          type: boolean
          description: True when the account has no email address (anonymous user).
        entity:
          $ref: "#/components/schemas/EntityInfo"

    EntityInfo:
      type: object
      properties:
        kind:
          type: string
          enum: [natural_person, corporation, service_account]
        display_name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        legal_name:
          type: string
        jurisdiction:
          type: string
        label:
          type: string

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            default_app:
              $ref: "#/components/schemas/AppSummary"

    SelfUpdateRequest:
      type: object
      properties:
        given_name:
          type: string
        family_name:
          type: string
        default_app_uuid:
          type: string
          format: uuid

    # -- Auth schemas --

    RegisterRequest:
      type: object
      required: [email, password, given_name, family_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        given_name:
          type: string
        family_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthToken:
      type: object
      properties:
        token:
          type: string
          description: JWT access token.
        expires_at:
          type: string
          format: date-time

    EmailCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    EmailCodeVerify:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8

    # -- Admin user management schemas --

    AdminCreateUserRequest:
      type: object
      required: [email, given_name, family_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        is_admin:
          type: boolean
          default: false

    AdminUpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        given_name:
          type: string
        family_name:
          type: string
        is_admin:
          type: boolean

    GrantRevokeRequest:
      type: object
      required: [is_admin]
      properties:
        is_admin:
          type: boolean

    AnonRegisterRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          description: Stable device fingerprint supplied by the client.
          example: "device-abc123"

    AnonAuthToken:
      type: object
      properties:
        token:
          type: string
          description: JWT access token.
        session_token:
          type: string
          description: Raw session token for cross-session identity continuity. Store securely on the client.
        user:
          type: object
          properties:
            uuid:
              type: string
              format: uuid
            is_anonymous:
              type: boolean

    # -- App schemas --

    AppSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    # AppDetail/AppCreateRequest/AppUpdateRequest (app CRUD request/response
    # shapes) were removed here: mod-users no longer serves /v1/apps CRUD
    # (see the "-- Apps --" path section above). See mod-core's own openapi
    # contract for the current app CRUD schemas.

    AppMemberRequest:
      type: object
      required: [user_uuid]
      properties:
        user_uuid:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string

    AppMember:
      type: object
      description: >-
        Response shape for assign/update-roles operations on the
        apps/user-accounts membership join.
      properties:
        app_uuid:
          type: string
          format: uuid
        user_uuid:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string

    AppUserAccount:
      type: object
      description: >-
        One row of the apps/user-accounts membership list. NOTE:
        user_account_id is the module's internal numeric id, not a uuid —
        this list endpoint pre-dates and does not yet follow this contract's
        general "internal ids are never exposed in HTTP responses" rule (see
        AGENTS.md); flagged here as a known, separate defect, not fixed by
        this schema change.
      properties:
        user_account_id:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string

    # -- Audit schemas --

    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        actor_uuid:
          type: string
          format: uuid
        before:
          type: object
        after:
          type: object
        created_at:
          type: string
          format: date-time

    # -- Pagination --

    PaginatedUsers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        total:
          type: integer

    PaginatedAudit:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer

    # -- SSH key schemas --

    SSHKey:
      type: object
      description: An SSH public key registered for git-over-SSH authentication.
      required: [uuid, key_type, fingerprint, public_key, label, created_at]
      properties:
        uuid:
          type: string
          format: uuid
        key_type:
          type: string
          description: SSH public-key algorithm, as reported by the key's own type string.
          enum:
            - ssh-ed25519
            - sk-ssh-ed25519@openssh.com
            - ecdsa-sha2-nistp256
            - ecdsa-sha2-nistp384
            - ecdsa-sha2-nistp521
            - sk-ecdsa-sha2-nistp256@openssh.com
            - ssh-rsa
          example: ssh-ed25519
        fingerprint:
          type: string
          description: SHA256 fingerprint in OpenSSH's `SHA256:<base64>` form.
          example: "SHA256:nThbg6kXUpJWGl7E1IGOCspRomTxdCARLviKw6E5SY8"
        public_key:
          type: string
          description: >-
            Canonical `authorized_keys` form (`<type> <base64>`), with no
            comment and no options.
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBl0Ub0EDwl4y6RGrKUYy3xzQeF8bYh9vQ6kzT8b3F9k"
        label:
          type: string
          maxLength: 100
          description: >-
            User-supplied label. Defaults to the key's `authorized_keys`
            comment (trimmed and truncated to 100 characters) when omitted
            at registration. Control and bidi-formatting characters are
            rejected in a supplied label and stripped from a
            comment-derived default.
        created_at:
          type: string
          format: date-time

    SSHKeyCreate:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: >-
            A single `authorized_keys`-format line (`<type> <base64>
            [comment]`). A line carrying `authorized_keys` options (for
            example `command="..."`, `no-pty`), a certificate key type
            (any `*-cert-v01@openssh.com` type), or more than one key is
            refused with `400 invalid_input` / `users.ssh_key_invalid`.
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBl0Ub0EDwl4y6RGrKUYy3xzQeF8bYh9vQ6kzT8b3F9k user@example.com"
        label:
          type: string
          maxLength: 100
          nullable: true
          description: >-
            Optional label, at most 100 characters. When omitted or null,
            defaults to the key's `authorized_keys` comment, trimmed and
            truncated to 100 characters. Control and bidi-formatting
            characters are rejected in a supplied label and stripped from a
            comment-derived default.

    PaginatedSSHKeys:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SSHKey"
        total:
          type: integer

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    UserUUID:
      name: user_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppUUID:
      name: app_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    KeyUUID:
      name: key_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountUUID:
      name: uuid
      in: path
      required: true
      description: >-
        Account UUID, as used by the `/v1/user-accounts/{uuid}` routes this
        module actually serves — distinct from the `UserUUID` parameter's
        `user_uuid` name, used by the older `/v1/users/{user_uuid}` admin
        paths.
      schema:
        type: string
        format: uuid
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string
      description: >-
        Step-up verification token, checked when `AUTH_REQUIRE_STEP_UP` is
        enabled. Missing or invalid when required yields `409
        users.step_up_required` (action-required, not an error).

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Caller lacks permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EmailUnverified:
      description: |
        Action-required, not an error: the actor is authenticated but their
        email is unverified. `action.path` is the verification page the
        client must navigate to before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Action"
    ForbiddenOrEmailUnverified:
      description: |
        Caller lacks permission (the `Error` shape, `error.code: forbidden`),
        OR the actor's email is unverified (the `Action` shape,
        `action.code: users.email_unverified`). Both share HTTP 403; the
        response body's top-level member — `error` vs. `action` — is the
        discriminator, never both on the same response. A missing resource
        on these endpoints is a genuine 404 (`NotFound`), not masked as 403.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/Action"
    OIDCNotConfirmed:
      description: |
        Action-required, not an error: the deployment's OIDC configuration
        is incomplete. `action.path` is the setup page and `action.data`
        carries `{state: <boot-state>}`. 503 is written verbatim here and is
        never remapped onto another status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Action"

    SSHKeyConflict:
      description: |
        Duplicate key: the fingerprint already matches another active,
        registered key. The response is identical whether the existing
        holder is the caller or a different account, so it never reveals
        which account holds the key (the `Error` shape, `error.code:
        conflict`, detail `users.ssh_key_in_use` on field `public_key`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SSHKeyStepUpRequired:
      description: |
        Action-required, not an error: step-up verification is required
        (`AUTH_REQUIRE_STEP_UP` is enabled) and the `X-Step-Up-Token` header
        was missing or invalid. `action.path` is the step-up flow the
        client must complete before retrying with a valid token (the
        `Action` shape, `action.code: users.step_up_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Action"

    SSHKeyRegisterConflict:
      description: |
        One of two shapes, both HTTP 409: a duplicate key (the `Error`
        shape, `error.code: conflict`, detail `users.ssh_key_in_use` on
        field `public_key` — see `SSHKeyConflict`), or step-up verification
        required (the `Action` shape, `action.code:
        users.step_up_required`, action-required, not an error — see
        `SSHKeyStepUpRequired`) when `AUTH_REQUIRE_STEP_UP` is enabled and
        the `X-Step-Up-Token` header was missing or invalid. The response
        body's top-level member — `error` vs. `action` — is the
        discriminator, never both on the same response.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/Action"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # -- Health --

  /healthz:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      operationId: liveness
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      summary: Readiness probe
      tags: [Health]
      security: []
      operationId: readiness
      responses:
        "200":
          description: Service is ready (DB reachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # -- Authentication (unauthenticated) --

  /v1/auth/register:
    post:
      summary: Create a new user account (email + password)
      tags: [Auth]
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; JWT returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/anonymous:
    post:
      tags: [Auth]
      summary: Create anonymous user account
      description: |
        Creates a new anonymous user account with no email address. Returns a JWT
        and a session token for cross-session identity continuity. The account can
        be upgraded to a named account by patching the email via PUT /v1/self.
      security: []
      operationId: registerAnonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonRegisterRequest"
      responses:
        "201":
          description: Anonymous account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonAuthToken"
        "400":
          description: Validation error (missing device_id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/login:
    post:
      summary: Authenticate with email + password
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/email-code:
    post:
      summary: Request a one-time email login code
      tags: [Auth]
      security: []
      operationId: requestEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "202":
          description: Code sent (if account exists). Response is always 202 to prevent enumeration.
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/email-code/verify:
    post:
      summary: Verify email code and obtain JWT
      tags: [Auth]
      security: []
      operationId: verifyEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeVerify"
      responses:
        "200":
          description: Code valid; JWT returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/password-reset:
    post:
      summary: Request a password-reset email
      tags: [Auth]
      security: []
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Reset email sent (if account exists).
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/password-reset/confirm:
    post:
      summary: Set new password using reset token
      tags: [Auth]
      security: []
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "200":
          description: Password updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/providers:
    get:
      summary: List enabled OIDC providers for the login UI
      description: |
        Returns the public-facing metadata (id, display name) for every OIDC
        provider currently enabled by server configuration. Never includes
        client secrets, issuer URLs, or requested scopes. Always returns 200
        with a (possibly empty) JSON array.
      tags: [Auth]
      security: []
      operationId: listProviders
      responses:
        "200":
          description: Array of enabled providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, display_name]
                  properties:
                    id:
                      type: string
                      description: Stable machine identifier, e.g. "google".
                      example: google
                    display_name:
                      type: string
                      description: Human-friendly label suitable for a button.
                      example: Google
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/oidc/{provider}/start:
    get:
      summary: Begin OIDC authorization-code flow
      description: |
        Generates a signed state token, writes it to the `oidc_state` cookie
        (scoped to `/v1/auth/oidc/`), and 302-redirects the browser to the
        provider's authorization endpoint.
      tags: [Auth]
      security: []
      operationId: startOIDC
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
          description: Provider identifier as listed by /v1/auth/providers.
        - in: query
          name: return
          required: false
          schema:
            type: string
            default: "/"
          description: |
            Site-relative path the GUI should navigate to after a successful
            login. Must begin with `/`; absolute URLs or protocol-relative
            references are rejected with 400 to prevent open-redirect attacks.
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Unknown provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/oidc/{provider}/callback:
    get:
      summary: OIDC authorization-code flow callback
      description: |
        Completes the OAuth 2.0 authorization-code exchange: validates the
        state cookie, trades the authorization code for an ID token, verifies
        the ID token (signature, issuer, audience, nonce), normalizes claims,
        resolves or creates the user, and mints a local session JWT. On
        success, 302-redirects to the configured frontend return URL with the
        JWT and original return path in the URL fragment.
      tags: [Auth]
      security: []
      operationId: callbackOIDC
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: false
          schema:
            type: string
          description: Authorization code issued by the provider.
        - in: query
          name: state
          required: false
          schema:
            type: string
          description: Signed state token the provider echoes back.
        - in: query
          name: error
          required: false
          schema:
            type: string
          description: Error code when the provider denies or cancels the flow.
      responses:
        "302":
          description: |
            Redirect to the frontend return URL. On success the URL fragment
            carries `token=<jwt>&return=<path>`; on error the query string
            carries `error=<code>`.
        "400":
          description: Invalid or missing state, code, or cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

