openapi: "3.0.3"
info:
  title: Users Module API
  description: |
    REST API for mod-users. Manages users and their identifiers, credentials,
    sessions and profiles, and authentication.

    ## Authentication

    Bearer is the only security scheme. A sign-in answers with the token
    response (`TokenResponse`): an EdDSA access token that carries a
    server-side session, plus an opaque refresh token held per client tab.
    Every authenticated request re-checks the session (or credential) and the
    acting profile; no route reads an authentication cookie. A client that
    holds no profile after sign-in (`selection_required: true`) calls the
    refresh grant with a chosen `profile_uuid`.

    ## Error precedence

    Routes that mount `RequireAuth` answer in this order: 401 (no live
    session or credential, codes `unauthorized`, `users.session_revoked` or
    `users.profile_unavailable`), 400 (stateless request shape: path UUIDs,
    JSON body, field validation, with `details`), 403 (authorization), 404
    (lookup), then 409 or 422 (state conflicts). Documented exceptions:

    - Public and credential routes (`/v1/auth/*`) have no 401 gate; their
      credential failures answer 401 `users.invalid_credentials`, which does
      not distinguish an unknown identifier from a wrong secret.
    - Step-up (`409 users.step_up_required`, an action-required response) comes
      after the 400 shape checks and before authorization on the self-service
      writes and the principal disable and enable.

    Every JSON body route decodes strictly: unknown fields, trailing data
    and an empty body give 400 (`invalid_json_body`), and a body over 1 MiB
    gives 400 (`body_too_large`).

    The earlier self, self-identity, self-credential, self-ssh-key,
    user-account, assume, app-membership and anonymous-demo route families are
    removed and answer 404.
  version: 0.2.0
  contact:
    email: zane@liquid-labs.com

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Auth
    description: >-
      Public sign-in, registration, token and OIDC routes. No bearer token is
      required.
  - name: Session
    description: >-
      The caller's session: read, switch profile, fork a refresh lineage,
      step up, and log out.
  - name: Me
    description: >-
      The caller's own user record, identifiers, credentials and sessions.
  - name: Principals
    description: Administration of users and service accounts.
  - name: Audit
    description: Audit log reads (served by the audit module).

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        EdDSA access token from the token response of any sign-in (password,
        email code, OIDC handoff, refresh, client credentials) or step-up.
        Pass as `Authorization: Bearer <token>`.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Either one of the reserved top-level
            codes (a closed set so a generic client can branch on it), or one
            of the sign-in and session codes listed below, which the sign-in
            and session flows use as the top-level code. Finer-grained,
            module-specific distinctions are carried in `details[].code`,
            namespaced by module (e.g. `users.email_taken`).
          enum:
            - unauthenticated
            - unauthorized
            - forbidden
            - not_found
            - invalid_input
            - conflict
            - internal_error
            - users.invalid_credentials
            - users.session_revoked
            - users.profile_unavailable
            - users.refresh_reuse
            - users.app_login_not_granted
            - users.byo_identity_disabled
          example: invalid_input
        message:
          type: string
          description: Human-readable error description.
          example: "invalid JSON body"
        details:
          type: array
          description: |
            Optional field-level and sub-error breakdown. Omitted (not present, not
            an empty array) when there is no per-field detail. For
            `users.profile_unavailable` the single entry carries the lock
            reason in `code` (for example `profile_suspended`).
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The input this error binds to (matches a form field name).
          example: email
        code:
          type: string
          description: Namespaced, module-specific detail code (e.g. `users.email_taken`).
          example: users.email_taken
        message:
          type: string
          description: Human-readable, safe-to-display detail message.
          example: "That email is already registered."

    Action:
      type: object
      description: |
        The action-required envelope. A response carrying this shape is a
        third response kind alongside a bare resource body (success) and the
        `Error` envelope: the request was well-formed and the actor
        authenticated, but the client must complete an out-of-band action
        (navigate/redirect the user) before the original operation can
        proceed. It is never returned alongside `Error` on the same
        response, and it MUST NOT be treated as an error (no banner/toast) —
        the client navigates to `path` instead. See
        `docs/mf-standards/architecture/api-response-design.md`, "The
        `action` object".
      required: [code, message, path]
      properties:
        code:
          type: string
          description: |
            Machine-readable, module-namespaced action code drawn from the
            owning module's closed, per-module registry (parallel to how
            `Error.code` documents its reserved enum, except namespaced
            rather than top-level — an action-required response has no
            generic/reserved-core layer). mod-users registers these codes
            today, enumerated below; a module MUST NOT emit an unregistered
            or un-namespaced action code.
          enum:
            - users.email_unverified
            - users.step_up_required
            - users.oidc_not_confirmed
          example: users.email_unverified
        message:
          type: string
          description: |
            Human-readable prompt to act — not an error. Safe to surface to
            an end user; never leaks internal identifiers, stack traces, or
            SQL.
          example: "Verify your email address before continuing."
        path:
          type: string
          description: |
            The application-relative navigation/redirect target the client
            must send the user to in order to complete the out-of-band
            action. Always relative — no scheme, no `//`-prefixed
            authority — never constructed from unvalidated external input.
          example: /verify-email
        data:
          type: object
          description: |
            Kind-specific auxiliary state the destination needs. Omitted
            (not present, not `{}`) when the action needs none. Present only
            for `users.oidc_not_confirmed`, which carries
            `{state: <boot-state>}` — `state` is one of the deployment's
            unconfirmed OIDC boot states (`init_failed`, `no_env_no_flag`;
            see `api/internal/config/oidc_state.go`'s `BootState`).
          example: { state: "no_env_no_flag" }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        db:
          type: string

    # -- Token response and profiles --

    TokenResponse:
      type: object
      description: |
        The token response of every sign-in, refresh, handoff, switch, fork
        and step-up. Every member is always present. `access_token` is null
        when the landing chain found no profile (`selection_required` is then
        true and the client calls the refresh grant with a chosen
        `profile_uuid`); `refresh_token` is null when none was minted (switch,
        step-up, client credentials); `session` is null for client
        credentials.
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - session
        - profile
        - selection_required
        - profiles
      properties:
        access_token:
          type: string
          nullable: true
          description: EdDSA access token carrying the session and the acting profile.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.
          example: 3600
        refresh_token:
          type: string
          nullable: true
          description: Opaque refresh token of this client's refresh lineage (one per tab).
        session:
          allOf:
            - $ref: "#/components/schemas/SessionView"
          nullable: true
        profile:
          allOf:
            - $ref: "#/components/schemas/ProfileView"
          nullable: true
          description: The profile the access token acts as; null with no access token.
        selection_required:
          type: boolean
        profiles:
          type: array
          description: The principal's profiles with their availability to this session.
          items:
            $ref: "#/components/schemas/ProfileView"

    AnonymousTokenResponse:
      description: >-
        The token response of a new guest, plus the device token of its
        anonymous credential. The device token is returned once, only when a
        guest is created, and signs the guest back in later.
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          properties:
            device_token:
              type: string
              description: Secret that signs this guest back in; store it securely.

    SessionView:
      type: object
      required: [uuid, acr, amr, auth_time, impersonating]
      properties:
        uuid:
          type: string
          format: uuid
        acr:
          type: integer
          format: int32
          description: Authentication context class reached by the session's factors.
          example: 1
        amr:
          type: array
          description: Authentication methods used (for example `pwd`).
          items:
            type: string
        auth_time:
          type: string
          format: date-time
          description: When the caller last authenticated; step-up refreshes it.
        impersonating:
          type: boolean

    ProfileView:
      type: object
      required: [uuid, kind, party, status, display_name, available, lock]
      properties:
        uuid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [personal, party]
        party:
          allOf:
            - $ref: "#/components/schemas/PartyView"
          nullable: true
          description: The party of a party profile; null for a personal profile.
        status:
          type: string
          description: Profile status.
        display_name:
          type: string
          description: >-
            The holder's name for a personal profile, or `<holder> @ <party>`
            for a party profile.
        available:
          type: boolean
          description: Whether the session (or credential) may act as this profile.
        lock:
          allOf:
            - $ref: "#/components/schemas/ProfileLock"
          nullable: true
          description: Why the profile is not available; null when it is.

    PartyView:
      type: object
      required: [uuid, kind, display_name]
      properties:
        uuid:
          type: string
          format: uuid
        kind:
          type: string
          description: The party's fundamental type slug (for example `organization`).
        display_name:
          type: string

    ProfileLock:
      type: object
      required: [reason, remedy]
      properties:
        reason:
          type: string
          description: |
            Lock reason: a `profile_availability` reason (for example
            `profile_suspended`, `acr_too_low`, `credential_not_authorized`),
            or `app_login_not_granted` when the session's invite-only app
            does not admit the profile.
        remedy:
          allOf:
            - $ref: "#/components/schemas/LockRemedy"
          nullable: true

    LockRemedy:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - sign_in_with_provider
            - step_up
            - sign_in_with_authorized_credential
            - accept_invitation
        provider_id:
          type: string
          description: "Present for `sign_in_with_provider`: the provider to sign in with."

    # -- Auth requests --

    RegisterRequest:
      type: object
      required: [email, password, given_name, family_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        given_name:
          type: string
        family_name:
          type: string
        app:
          type: string
          description: The app (uuid) the new session signs in to.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        app:
          type: string
          description: The app (uuid) the session signs in to.
        profile_uuid:
          type: string
          format: uuid
          description: The profile to land on.

    AnonymousRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          description: Stable device fingerprint supplied by the client.
          example: "device-abc123"
        device_token:
          type: string
          description: >-
            The device token a previous call returned. When set, signs that
            guest back in (200) instead of creating a guest; an unknown token,
            or one registered for another device, is 401
            `users.invalid_credentials`.
        app:
          type: string
          description: The app (uuid) the session signs in to.

    EmailCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum: [login]
          description: Optional; `login` is the only purpose.

    EmailCodeVerify:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        purpose:
          type: string
          enum: [login]
        app:
          type: string
          description: The app (uuid) the session signs in to.
        profile_uuid:
          type: string
          format: uuid
          description: The profile to land on.

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [refresh_token, client_credentials]
        refresh_token:
          type: string
          description: Required for the `refresh_token` grant.
        profile_uuid:
          type: string
          format: uuid
          description: Required for `refresh_token`; optional for `client_credentials`.
        client_id:
          type: string
          description: Required for `client_credentials`.
        client_secret:
          type: string
          description: Required for `client_credentials`.
        app:
          type: string
          description: Optional audience app (uuid) of a `client_credentials` token.

    HandoffRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The one-time code the OIDC callback redirect carried in `#handoff=`.

    # -- Session requests --

    SwitchRequest:
      type: object
      required: [profile_uuid]
      properties:
        profile_uuid:
          type: string
          format: uuid

    StepUpPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    StepUpEmailCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: One of the caller's email identifiers; the primary email when omitted.

    StepUpEmailCodeVerify:
      type: object
      required: [code]
      properties:
        code:
          type: string
        email:
          type: string
          format: email

    SessionInfo:
      type: object
      required: [session, profile, profiles]
      properties:
        session:
          allOf:
            - $ref: "#/components/schemas/SessionView"
          nullable: true
        profile:
          allOf:
            - $ref: "#/components/schemas/ProfileView"
          nullable: true
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileView"

    AuthorizeURL:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
          description: >-
            The provider's authorization URL. The browser navigates to it; the
            signed state cookie is set on this response.

    # -- Me --

    UserView:
      type: object
      required:
        - uuid
        - kind
        - is_guest
        - managed
        - given_name
        - family_name
        - display_name
        - email
        - email_verified
        - default_profile_uuid
        - default_app_uuid
        - created_at
        - updated_at
      properties:
        uuid:
          type: string
          format: uuid
        kind:
          type: string
          example: user
        is_guest:
          type: boolean
        managed:
          type: boolean
          description: True for a managed user (owned by a party).
        given_name:
          type: string
          nullable: true
        family_name:
          type: string
          nullable: true
        display_name:
          type: string
        email:
          type: string
          nullable: true
          description: The primary email identifier.
        email_verified:
          type: boolean
          description: True when the user holds at least one verified email.
        default_profile_uuid:
          type: string
          format: uuid
          nullable: true
        default_app_uuid:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateMeRequest:
      type: object
      description: Absent fields are left unchanged; the two default fields accept null to clear.
      properties:
        given_name:
          type: string
        family_name:
          type: string
        default_profile_uuid:
          type: string
          format: uuid
          nullable: true
        default_app_uuid:
          type: string
          format: uuid
          nullable: true

    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileView"

    IdentifierView:
      type: object
      required: [uuid, kind, value, is_primary, verified, verified_at, created_at]
      properties:
        uuid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [email]
        value:
          type: string
        is_primary:
          type: boolean
        verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    IdentifierList:
      type: object
      required: [identifiers]
      properties:
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/IdentifierView"

    AddIdentifierRequest:
      type: object
      required: [value]
      properties:
        kind:
          type: string
          enum: [email]
          default: email
        value:
          type: string

    VerifyIdentifierRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    CredentialView:
      type: object
      description: >-
        An active credential: identifying and display attributes only, never a
        hash, secret or token. Kind-specific members are present only for
        their kind.
      required:
        - uuid
        - kind
        - label
        - created_at
        - last_used_at
        - expires_at
        - default_profile_uuid
        - confined_to_party_uuid
      properties:
        uuid:
          type: string
          format: uuid
        kind:
          type: string
          description: Credential kind (for example `password`, `oidc`, `ssh_key`, `email_otp`, `api_key`, `anon`).
        label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        default_profile_uuid:
          type: string
          format: uuid
          nullable: true
        confined_to_party_uuid:
          type: string
          format: uuid
          nullable: true
        identifier_uuid:
          type: string
          format: uuid
          description: The identifier a password or email-code credential is bound to.
        provider_id:
          type: string
          description: Present for `oidc`.
        email_at_link:
          type: string
          description: "Present for `oidc`: the email the provider asserted when linked."
        key_type:
          type: string
          description: Present for `ssh_key`.
        fingerprint:
          type: string
          description: Present for `ssh_key`.
        public_key:
          type: string
          description: "Present for `ssh_key`: canonical `authorized_keys` form."

    CredentialList:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialView"

    AddPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
        label:
          type: string
        identifier_uuid:
          type: string
          format: uuid
          description: One of the caller's identifiers; the primary email when omitted.

    AddSSHKeyRequest:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: >-
            A single `authorized_keys`-format line (`<type> <base64>
            [comment]`). A line carrying options, a certificate key type or
            more than one key is refused with 400 `users.ssh_key_invalid`.
        label:
          type: string
          maxLength: 100
          nullable: true

    PatchCredentialRequest:
      type: object
      description: At least one member is required; `default_profile_uuid` accepts null to clear.
      properties:
        label:
          type: string
        default_profile_uuid:
          type: string
          format: uuid
          nullable: true

    SelfSession:
      type: object
      required:
        - uuid
        - acr
        - amr
        - auth_time
        - created_at
        - last_seen_at
        - expires_at
        - impersonating
        - current
      properties:
        uuid:
          type: string
          format: uuid
        acr:
          type: integer
          format: int32
        amr:
          type: array
          items:
            type: string
        auth_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        impersonating:
          type: boolean
        current:
          type: boolean
          description: True for the session that made the request.

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SelfSession"

    UpgradeRequest:
      type: object
      required: [email, password, given_name, family_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        given_name:
          type: string
        family_name:
          type: string

    # -- Principals --

    PrincipalView:
      type: object
      required:
        - uuid
        - kind
        - display_name
        - email
        - is_guest
        - managed
        - managing_party_uuid
        - disabled
        - disabled_at
        - disabled_reason
        - created_at
      properties:
        uuid:
          type: string
          format: uuid
        kind:
          type: string
          enum: [user, service_account]
        display_name:
          type: string
        email:
          type: string
          nullable: true
          description: The primary email of a user.
        is_guest:
          type: boolean
        managed:
          type: boolean
        managing_party_uuid:
          type: string
          format: uuid
          nullable: true
        disabled:
          type: boolean
        disabled_at:
          type: string
          format: date-time
          nullable: true
        disabled_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PrincipalPage:
      type: object
      required: [principals, total, limit, offset]
      properties:
        principals:
          type: array
          items:
            $ref: "#/components/schemas/PrincipalView"
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32

    DisablePrincipalRequest:
      type: object
      description: The body is optional.
      properties:
        reason:
          type: string
          maxLength: 500
          description: Free text recorded on the principal.

    # -- Audit schemas --

    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        actor_uuid:
          type: string
          format: uuid
        before:
          type: object
        after:
          type: object
        created_at:
          type: string
          format: date-time

    PaginatedAudit:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    UUID:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Provider:
      name: provider
      in: path
      required: true
      description: Provider identifier as listed by `GET /v1/auth/providers`.
      schema:
        type: string
    ReturnPath:
      name: return
      in: query
      required: false
      description: |
        Site-relative path the GUI navigates to after the flow completes. Must
        begin with `/`; absolute URLs and protocol-relative references are
        refused with 400 (`users.return_path_invalid`) to prevent open
        redirects.
      schema:
        type: string
        default: "/"

  responses:
    BadRequest:
      description: |
        Invalid request (`error.code: invalid_input`), returned for stateless
        request-shape faults before authorization. `error.details` names each
        fault: `invalid_json_body` (malformed JSON, unknown field, trailing
        data, empty body), `body_too_large`, `invalid_uuid` (malformed path or
        body UUID), or a field code such as `users.email_required`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        No live session or credential (the `Error` shape). `code` is
        `unauthorized` for a missing, malformed or expired token,
        `users.session_revoked` when the session is revoked or expired, and
        `users.profile_unavailable` when the acting profile is locked (the
        lock reason is in `details[0].code`). On a sign-in, token, handoff or
        step-up route the code is `users.invalid_credentials`,
        `users.session_revoked`, `users.refresh_reuse` or
        `users.profile_unavailable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Caller lacks permission (`error.code: forbidden`), or a sign-in is
        refused (`users.app_login_not_granted` for an invite-only app,
        `users.byo_identity_disabled` when self-registration is off).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found, or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        State conflict (`error.code: conflict`) with a detail code such as
        `users.identifier_taken`, `users.oidc_identity_in_use`,
        `users.ssh_key_in_use`, `users.last_credential`,
        `users.guest_upgrade_required` or `users.password_exists`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StepUpRequired:
      description: |
        Action-required, not an error: the operation needs a fresh
        authentication (`action.code: users.step_up_required`). The client
        completes a step-up (`POST /v1/session/step-up/*`) and retries. A
        wrong password or code on a step-up route is this same response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Action"
    ConflictOrStepUp:
      description: |
        One of two shapes, both HTTP 409: a state conflict (the `Error`
        shape, `error.code: conflict`), or step-up required (the `Action`
        shape, `action.code: users.step_up_required`). The response body's
        top-level member, `error` or `action`, is the discriminator.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/Action"
    ForbiddenOrEmailUnverified:
      description: |
        Caller lacks permission (the `Error` shape, `error.code: forbidden`),
        OR the actor's email is unverified (the `Action` shape,
        `action.code: users.email_unverified`). Both share HTTP 403; the
        response body's top-level member, `error` or `action`, is the
        discriminator, never both on the same response.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/Action"
    OIDCNotConfirmed:
      description: |
        Action-required, not an error: the deployment's OIDC configuration
        is incomplete. `action.path` is the setup page and `action.data`
        carries `{state: <boot-state>}`. 503 is written verbatim here and is
        never remapped onto another status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Action"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # -- Health --

  /healthz:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      operationId: liveness
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      summary: Readiness probe
      tags: [Health]
      security: []
      operationId: readiness
      responses:
        "200":
          description: Service is ready (DB reachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready. The `db` field is the fixed value `unavailable`; failure detail is logged server-side only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"


  # -- Authentication --


  # -- Authentication (public, behind requireOIDCConfirmed) --

  /v1/auth/register:
    post:
      summary: Register a user (email and password)
      description: |
        Self-registration of a bring-your-own user. In one transaction it creates the user
        with its own person record and personal profile, the primary email identifier
        (unverified), the password credential and the session, then emails a
        verification code. 403 `users.byo_identity_disabled` when the platform does not
        allow bring-your-own identities.
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered; token response for the new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/login:
    post:
      summary: Sign in with email and password
      description: |
        Answers 200 with the token response; `access_token` is null and
        `selection_required` true when the landing chain finds no profile. Every
        credential failure is 401 `users.invalid_credentials`.
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/anonymous:
    post:
      summary: Guest sign-in
      description: |
        Without a `device_token` it creates a guest user (personal profile, no person,
        one anonymous credential) and its session, answering 201 with the token
        response and the new `device_token`. With a `device_token` it signs that guest
        back in (200, no new device token). Upgrade a guest with `POST /v1/me/upgrade`.
        Both are refused with 403 `users.byo_identity_disabled` when the platform does
        not allow bring-your-own identities.
      tags: [Auth]
      operationId: anonymousSignIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousRequest"
      responses:
        "201":
          description: Guest created; token response plus the one-time `device_token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousTokenResponse"
        "200":
          description: Existing guest signed back in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/email-code/request:
    post:
      summary: Request a one-time email sign-in code
      description: |
        Always answers 204 after the same floor latency, whether or not the email is
        registered; the code is minted and sent in the background.
      tags: [Auth]
      operationId: requestEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/email-code/verify:
    post:
      summary: Verify an email code and sign in
      tags: [Auth]
      operationId: verifyEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeVerify"
      responses:
        "200":
          description: Code valid; token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/password-reset/request:
    post:
      summary: Request a password-reset email
      description: |
        Always answers 204 after the same floor latency, whether or not the email is registered.
      tags: [Auth]
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/password-reset/confirm:
    post:
      summary: Set a new password with a reset token
      description: |
        Supersedes the password bound to the token's email identifier, which also
        revokes every session holding it. Does not sign in. An unknown, expired or
        spent token is 401 `users.invalid_credentials`.
      tags: [Auth]
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: Password updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/token:
    post:
      summary: Refresh an access token or exchange client credentials
      description: |
        `grant_type` `refresh_token` (with `refresh_token` and `profile_uuid`) rotates the
        tab's refresh token and issues an access token for the named profile after
        re-running its availability. A reused token revokes the whole session (401
        `users.refresh_reuse`); an unknown or expired token, or a dead session, is 401
        `users.session_revoked`; an unavailable profile is 401
        `users.profile_unavailable` (the refresh token stays usable).

        `grant_type` `client_credentials` (with `client_id`, `client_secret`, optional
        `profile_uuid` and `app`) issues an access token for an API key, with no
        session and no refresh token. Bad credentials are 401
        `users.invalid_credentials`.
      tags: [Auth]
      operationId: token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/handoff:
    post:
      summary: Exchange an OIDC handoff code for tokens
      description: |
        Exchanges the one-time code an OIDC callback redirect carried
        (`#handoff=<code>`) for the token response, once. A spent, expired or unknown
        code is 401 `users.invalid_credentials`.
      tags: [Auth]
      operationId: handoff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRequest"
      responses:
        "200":
          description: Token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/providers:
    get:
      summary: List enabled OIDC providers for the login UI
      description: |
        Returns the public-facing metadata (id, display name) for every OIDC
        provider currently enabled by server configuration. Never includes
        client secrets, issuer URLs, or requested scopes. Always returns 200
        with a (possibly empty) JSON array.
      tags: [Auth]
      security: []
      operationId: listProviders
      responses:
        "200":
          description: Array of enabled providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, display_name]
                  properties:
                    id:
                      type: string
                      description: Stable machine identifier, e.g. "google".
                      example: google
                    display_name:
                      type: string
                      description: Human-friendly label suitable for a button.
                      example: Google
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/oidc/{provider}/start:
    get:
      summary: Begin the OIDC sign-in authorization-code flow
      description: |
        Generates a signed state token, writes it to the `oidc_state` cookie
        (scoped to the OIDC route prefix), and 302-redirects the browser to the
        provider's authorization endpoint.
      tags: [Auth]
      security: []
      operationId: startOIDC
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ReturnPath"
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Unknown or disabled provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/auth/oidc/{provider}/callback:
    get:
      summary: OIDC authorization-code flow callback
      description: |
        Completes the authorization-code exchange: validates the state cookie,
        trades the code for an ID token, verifies it (signature, issuer, audience,
        nonce) and resolves the verified identity against credentials by issuer
        and subject, never by email. What happens next depends on the flow the
        state names:

        - sign-in: creates (or, for a just-in-time provider, creates then uses)
          the session and a one-time handoff code, and redirects to the
          frontend return URL with `#handoff=<code>`; the client exchanges the
          code at `POST /v1/auth/handoff`. No token is placed in the redirect.
        - link: links the identity as an `oidc` credential of the calling
          session's principal and redirects with an outcome.
        - step-up: raises the calling session's factors and redirects with an
          outcome.

        A refusal redirects with `#error=<code>`, one of
        `account_exists_sign_in_and_link`, `no_account`,
        `authentication_failed` or `missing_email`.
      tags: [Auth]
      security: []
      operationId: callbackOIDC
      parameters:
        - $ref: "#/components/parameters/Provider"
        - in: query
          name: code
          required: false
          schema:
            type: string
          description: Authorization code issued by the provider.
        - in: query
          name: state
          required: false
          schema:
            type: string
          description: Signed state token the provider echoes back.
        - in: query
          name: error
          required: false
          schema:
            type: string
          description: Error code when the provider denies or cancels the flow.
      responses:
        "302":
          description: Redirect to the frontend return URL, with `#handoff=<code>` on a sign-in or `#error=<code>` on a refusal.
        "400":
          description: Invalid or missing state, code, or cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  # -- Session (bearer) --

  /v1/session:
    get:
      summary: Read the caller's session
      description: |
        The session, the profile the token acts as, and the principal's profiles with their availability.
      tags: [Session]
      operationId: getSession
      responses:
        "200":
          description: Session information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/session/switch:
    post:
      summary: Switch the acting profile
      description: |
        Returns a new access token acting as `profile_uuid` for the same session, with no
        session write and no refresh token. An unavailable profile is 401
        `users.profile_unavailable`, and 403 `users.app_login_not_granted` for the
        invite-only app gate.
      tags: [Session]
      operationId: switchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchRequest"
      responses:
        "200":
          description: Token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/session/fork:
    post:
      summary: Fork a refresh lineage
      description: |
        Starts a new refresh lineage for the caller's session (a new tab) and returns it
        with an access token acting as the caller's current profile. The body is ignored.
      tags: [Session]
      operationId: forkSession
      responses:
        "200":
          description: Token response with a new refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/session/step-up/password:
    post:
      summary: Step up with the password
      description: |
        Re-verifies a password of the caller, raises the session's acr as the factors
        allow, sets `auth_time` to now and returns a fresh access token (no refresh
        token). Any refusal is the 409 `users.step_up_required` action.
      tags: [Session]
      operationId: stepUpPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpPasswordRequest"
      responses:
        "200":
          description: Token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StepUpRequired"

  /v1/session/step-up/email-code/request:
    post:
      summary: Email a step-up code
      description: |
        Emails a step-up code bound to the session. 204; a request inside the cooldown
        sends nothing. No email credential to send to is the 409
        `users.step_up_required` action. The body is optional.
      tags: [Session]
      operationId: requestStepUpEmailCode
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpEmailCodeRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StepUpRequired"

  /v1/session/step-up/email-code/verify:
    post:
      summary: Step up with an emailed code
      description: |
        Verifies the step-up code, adds the email credential as a factor and returns a fresh access token.
      tags: [Session]
      operationId: verifyStepUpEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpEmailCodeVerify"
      responses:
        "200":
          description: Token response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StepUpRequired"

  /v1/session/step-up/oidc/{provider}/start:
    post:
      summary: Begin an OIDC step-up
      description: |
        Returns the authorize URL of a step-up flow for the caller's session and
        sets the signed state cookie. The principal must hold an active `oidc`
        credential for the provider; otherwise, and for an impersonation, the
        refusal is 409 `users.step_up_required`. The callback completes the step-up
        and redirects to the return path.
      tags: [Session]
      operationId: startOIDCStepUp
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ReturnPath"
      responses:
        "200":
          description: Authorize URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeURL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StepUpRequired"

  /v1/session/logout:
    post:
      summary: Log out
      description: |
        Revokes the caller's session (revoke reason `logout`) and its refresh lineages. The body is ignored.
      tags: [Session]
      operationId: logout
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  # -- Me (bearer; reachable with an unverified email) --

  /v1/me:
    get:
      summary: Read the caller's user record
      tags: [Me]
      operationId: getMe
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update the caller's user record
      description: |
        Names (on the user's own person record) and default profile and app. Absent fields are left unchanged.
      tags: [Me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/profiles:
    get:
      summary: List the caller's profiles
      description: |
        Every non-ended profile with its availability to the caller's session and, when locked, the lock reason and remedy.
      tags: [Me]
      operationId: listMyProfiles
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/identifiers:
    get:
      summary: List the caller's identifiers
      tags: [Me]
      operationId: listMyIdentifiers
      responses:
        "200":
          description: Identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Add an email identifier
      description: |
        Adds an unverified email. Verify it with the emailed code.
      tags: [Me]
      operationId: addMyIdentifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIdentifierRequest"
      responses:
        "201":
          description: The identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/identifiers/{uuid}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    delete:
      summary: Remove an identifier
      tags: [Me]
      operationId: removeMyIdentifier
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/identifiers/{uuid}/verification:
    parameters:
      - $ref: "#/components/parameters/UUID"
    post:
      summary: Email a verification code
      description: |
        204; an already verified identifier, or a request inside the cooldown, sends nothing.
      tags: [Me]
      operationId: requestIdentifierVerification
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/me/identifiers/{uuid}/verify:
    parameters:
      - $ref: "#/components/parameters/UUID"
    post:
      summary: Verify an identifier with the emailed code
      tags: [Me]
      operationId: verifyMyIdentifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyIdentifierRequest"
      responses:
        "200":
          description: The verified identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/me/identifiers/{uuid}/primary:
    parameters:
      - $ref: "#/components/parameters/UUID"
    put:
      summary: Make an identifier primary
      description: |
        The body is ignored.
      tags: [Me]
      operationId: setMyPrimaryIdentifier
      responses:
        "200":
          description: The identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/credentials:
    get:
      summary: List the caller's active credentials
      tags: [Me]
      operationId: listMyCredentials
      responses:
        "200":
          description: Credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/credentials/password:
    post:
      summary: Add a password credential
      tags: [Me]
      operationId: addMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasswordRequest"
      responses:
        "201":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/credentials/ssh-keys:
    post:
      summary: Add an SSH key credential
      tags: [Me]
      operationId: addMySSHKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSSHKeyRequest"
      responses:
        "201":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/credentials/oidc/{provider}/start:
    post:
      summary: Begin linking an OIDC identity
      description: |
        Returns the authorize URL of a link flow for the caller's session and sets
        the signed state cookie. The callback links the verified identity as an
        `oidc` credential and redirects to the return path. A service account or a
        managed user cannot link (403); a guest must upgrade first (409
        `users.guest_upgrade_required`); an identity already linked is 409
        `users.oidc_identity_in_use`.
      tags: [Me]
      operationId: startOIDCLink
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ReturnPath"
      responses:
        "200":
          description: Authorize URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeURL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/credentials/{uuid}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    patch:
      summary: Update a credential's label or landing profile
      tags: [Me]
      operationId: patchMyCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCredentialRequest"
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"
    delete:
      summary: Revoke a credential
      description: |
        Revokes the credential. The last interactive credential is 409 `users.last_credential`.
      tags: [Me]
      operationId: revokeMyCredential
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/sessions:
    get:
      summary: List the caller's live sessions
      description: |
        Most recently seen first; the requesting session is marked `current`.
      tags: [Me]
      operationId: listMySessions
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/sessions/{uuid}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    delete:
      summary: Revoke one of the caller's sessions
      description: |
        The caller's own current session may be revoked (it then behaves as a logout).
      tags: [Me]
      operationId: revokeMySession
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/me/upgrade:
    post:
      summary: Upgrade a guest to a registered user
      description: |
        Turns the calling guest into a registered user. The guest's anonymous credential is
        revoked, which ends the guest's sessions, so the client signs in again with the
        email and password it just registered. 403 `users.byo_identity_disabled` when the
        platform does not allow bring-your-own identities.
      tags: [Me]
      operationId: upgradeGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "200":
          description: The user record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  # -- Principals (bearer) --

  /v1/principals:
    get:
      summary: List principals
      description: |
        Users and service accounts the caller may list, through the
        `accessible_*_ids_for_actor` access functions.
      tags: [Principals]
      operationId: listPrincipals
      parameters:
        - in: query
          name: kind
          required: false
          schema:
            type: string
            enum: [user, service_account]
          description: Both kinds when omitted.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of principals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/principals/{uuid}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    get:
      summary: Read a principal
      description: |
        404 for an unknown principal and for one the caller may not read.
      tags: [Principals]
      operationId: getPrincipal
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/principals/{uuid}/disable:
    parameters:
      - $ref: "#/components/parameters/UUID"
    post:
      summary: Disable a principal
      description: |
        Disables the principal and revokes its sessions. Requires `update` on the principal and a step-up. The body is optional.
      tags: [Principals]
      operationId: disablePrincipal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisablePrincipalRequest"
      responses:
        "200":
          description: The updated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  /v1/principals/{uuid}/enable:
    parameters:
      - $ref: "#/components/parameters/UUID"
    post:
      summary: Enable a principal
      description: |
        The body is ignored.
      tags: [Principals]
      operationId: enablePrincipal
      responses:
        "200":
          description: The updated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrStepUp"

  # -- Audit --

  /v1/audit:
    get:
      summary: List recent audit log entries (admin)
      tags: [Audit]
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: resource_type
          in: query
          schema:
            type: string
          description: Filter by resource type (e.g. users, apps).
      responses:
        "200":
          description: Paginated audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAudit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEmailUnverified"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

  /v1/audit/{resource_type}/{resource_uuid}:
    get:
      summary: Audit log for a specific object (admin)
      tags: [Audit]
      operationId: auditByTarget
      parameters:
        - name: resource_type
          in: path
          required: true
          schema:
            type: string
        - name: resource_uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated audit entries for the resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAudit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEmailUnverified"
        "503":
          $ref: "#/components/responses/OIDCNotConfirmed"

