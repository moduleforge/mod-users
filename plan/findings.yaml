    - title: Lock order inversion (task 004). gateCredent…
      id: DuW4
      date: "2026-10-26"
      tags:
        - type:bug
        - plan/phase:remediation-03
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/service/party_policy.go
        lines: 540-580
        severity: minor
        confidence: medium
        concerns: correctness
        description:
          Lock order inversion (task 004). gateCredentialWrite takes the credential row FOR UPDATE first and then the holder's profile FOR SHARE. EndInTx/endLocked takes the profile FOR UPDATE first (lockProfile) and then, in departureCleanupInTx step 2, UPDATEs (RevokeCredential) every holder credential confined to the party, which needs that same credential row lock. A deadlock is realistic when a writer (Confine/Unconfine/Authorize/Deauthorize of a credential already confined to the party) and an ending (holder leave, admin end, EndInTx) of that holder's profile run concurrently: writer holds credential, waits on profile share lock; ender holds profile, waits on credential row. Postgres aborts one transaction with 40P01. inTx has no deadlock retry, so one caller gets a 500 (and the ending, if chosen as victim, is lost). The window is narrow (only credentials confined to this party) and the failure is fail-safe, but the tx guarantee the task claims is not clean. The concurrency test only covers the ordering where the ender commits first, not the interleaving.
        recommendation:
          Take the holder's profile lock before the credential lock (resolve the profile by holder_id and party_id from the unlocked cred read, lock it FOR SHARE, then lock the credential and re-read), matching EndInTx order. Alternatively map SQLSTATE 40P01 to a retry or a 409. Add a test that interleaves a leave with a confine of a confined credential.
