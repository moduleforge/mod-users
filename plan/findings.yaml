    - title: Manifest cannot register display renderers
      id: xgGT
      date: "2026-10-23"
      tags:
        - type:enhancement
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: 'usersservice.RegisterDisplayRenderers (api/usersservice/service.go) is called only from api/cmd/server/main.go. moduleforge.module.yaml has no way to express it: a module hook emits `<var> := symbol(args)` and needs a registeredOn method, and the function returns nothing. Apps generated by mfgen therefore do not register the user and profile display renderers. Needs an mfgen/manifest mechanism or a constructor-style wrapper the manifest can reach.'
