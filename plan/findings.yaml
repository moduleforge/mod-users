        lines: 381-434
        severity: minor
        confidence: medium
        concerns: correctness
        description:
          Verified (b). callbackLink never calls h.oauth.PolicyFor and passes no ConfinedToPartyID to
          LinkOIDCInTx, so a bring-your-own user linking through a provider whose party_id is set gets an
          unconfined oidc credential; only the managed JIT path (createManagedUser) confines to the
          provider's party. The link start (sessionStart/checkStartGate) also does not look at the
          provider's party or jit_mode. The task 006 notes acknowledge 'Link does not confine the new
          credential to a party-bound provider's party', and requirement 1 only mandates confinement for
          managed JIT, so this is not a stated-requirement miss. It is a semantic gap: a party-bound
          provider's identity ends up able to sign in to the BYO user's personal profile and all other
          parties, while confining would hide the personal profile (a personal profile is hidden by any
          confinement in profile_availability_for), which is likely why it was left open.
        recommendation:
          Decide the intended semantics for linking a party-bound provider (confine, refuse, or allow
          unconfined) and record it. If confinement is wanted, resolve PolicyFor in callbackLink and set
          ConfinedToPartyID to policy.PartyID when it is > 0; if refusal is wanted, refuse with
          RedirectErrAuthFailed in LinkStart and callbackLink.
