items:
    - title: The unauthenticated handler now spawns `go h…
      id: rQjH
      date: "2026-10-14"
      tags:
        - type:security
        - plan/phase:remediation-03
        - priority:medium
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/auth/emailcode.go
        lines: 87-104
        severity: minor
        confidence: medium
        concerns: security
        description:
          The unauthenticated handler now spawns `go h.sendEmailCode(...)` on context.WithoutCancel and returns at 200ms regardless of completion. The goroutine has no deadline, no concurrency bound, and no recover. Previously the handler blocked on the work, so in-flight work was bounded by open requests. Now a slow or hung DB or SMTP call (bcrypt, email send) is decoupled from request lifetime, so an attacker can accumulate goroutines faster than they finish. A panic in the goroutine is not caught by net/http's per-handler recover and would terminate the process. The cooldown pre-check limits hashing only for repeat (user, purpose) pairs, not for distinct valid emails.
        recommendation:
          Wrap the background work in a bounded context (context.WithTimeout over context.WithoutCancel), add a deferred recover that logs, and optionally bound concurrency with a semaphore or worker pool; drop work when saturated, which is acceptable under the anti-enumeration contract.
    - title: The search_path pin is correct (pg_catalog f…
      id: jwyA
      date: "2026-10-14"
      tags:
        - type:security
        - plan/phase:remediation-03
        - priority:low
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: model/migrations/sql/0104_email_codes_cooldown_index.sql
        lines: 33-40
        severity: suggestion
        confidence: low
        concerns: security
        description:
          The search_path pin is correct (pg_catalog first, real schema, pg_temp last; every function the body calls is in pg_catalog). Residual: the ALTER FUNCTION target is unqualified, so it resolves through the migrating session's search_path. If that differs from where 0103 created the function, the ALTER could hit a different function or fail. The same applies to the Down. Low risk since 0103 used the same session conventions.
        recommendation:
          Optionally qualify the function with current_schema() in the dynamic SQL (%I.create_email_code_with_cooldown) so the pin always targets the function created in that schema.
