    - title: RemoveIdentifierInTx (reached from SelfRemov…
      id: aA5K
      date: "2026-10-24"
      tags:
        - type:bug
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/service/user_service.go
        lines: 572-637
        severity: major
        confidence: high
        concerns: correctness
        description:
          RemoveIdentifierInTx (reached from SelfRemoveIdentifier, DELETE /v1/me/identifiers/{uuid})
          revokes the credentials bound to the identifier and then DELETEs the identifier. cred_password.
          identifier_id and cred_email_otp.identifier_id reference user_identifiers ON DELETE RESTRICT
          (baseline 0100) and credentials are never deleted, so the DELETE hits a foreign-key violation
          for every identifier that has ever had a bound credential. Registration always binds a
          password to the primary email, and verifying an email always creates an email_otp, so such an
          identifier can never be removed: the savepoint rolls back the revocations and the caller gets
          409 users.identifier_in_use (a code not in API surface section 7). Only identifiers that never
          had a credential (an added, never verified or password-bound secondary email) can be removed.
          Task 004 requirement 2 lists 'remove' for identifiers and the surface note lists the route as
          supported. The task agent noted this as a finding; it is recorded here because it makes the
          route effectively non-functional for the common case. The savepoint behavior against the real FK
          is untested by the unit fakes.
        recommendation:
          Decide the contract: either change the schema (for example soft-delete identifiers with a
          removed_at column excluded from the unique index and lookups, or drop the RESTRICT for revoked
          credentials), or narrow the requirement and document that only never-bound identifiers are
          removable and give the route a section 7 error code. Add a real-database test for removing a
          verified identifier.
    - title: ListActivePasswordsByPrincipal filters cred_…
      id: 86kP
      date: "2026-10-24"
      tags:
        - type:optimization
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: model/migrations/sql/0100_baseline.sql
        lines: 530-546
        severity: major
        confidence: medium
        concerns: efficiency
        description:
          ListActivePasswordsByPrincipal filters cred_password by "principal_id = $1 AND active". The only
          principal_id index is partial (active AND identifier_id IS NULL), so identifier-bound passwords
          (the normal case) have no usable index and the query seq-scans cred_password (O(users)). It runs
          on step-up, password reset, register/upgrade and identifier removal (warm paths).
        recommendation:
          Add CREATE INDEX cred_password_principal_id_idx ON mod_users.cred_password (principal_id) WHERE active.
    - title: auth_challenges has FK columns credential_id…
      id: Pjuz
      date: "2026-10-24"
      tags:
        - type:optimization
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: model/migrations/sql/0100_baseline.sql
        lines: 939-968
        severity: major
        confidence: medium
        concerns: efficiency
        description:
          auth_challenges has FK columns credential_id, identifier_id, principal_id, session_id (ON DELETE CASCADE)
          with no plain index on them; the only subject index is on COALESCE(...) expressions, which neither
          the cascade lookups nor GetLatestOpenChallenge / ConsumeOpenChallengesBySubject (which use
          IS NOT DISTINCT FROM) can use. Open-challenge lookups on the email-code and verification path
          and every session/identifier/credential delete scan by kind or the whole table as it grows.
        recommendation:
          Index principal_id, identifier_id, session_id and credential_id (partial WHERE NOT NULL), and
          write the lookups as COALESCE(col,0) = COALESCE(arg,0) to match the cooldown index, or add a plain
          (kind, principal_id, identifier_id, session_id) index.
