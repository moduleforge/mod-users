items:
    - title: 'ENVIRONMENT: mod-core/gui/node_modules contai'
      id: ZNOd
      date: "2026-10-04"
      tags:
        - type:ambiguity
        - plan/phase:gui-seams
        - priority:unspecified
        - effort:unspecified
      text: 'ENVIRONMENT: mod-core/gui/node_modules contains dangling relative symlinks (e.g. react, tsup -> ../../../users-gui-integration-seams-01-001/node_modules/.bun/...) written by the task worktree provisioning install (known worktree-symlink gap in AGENTS.md). Without a fix, bun test in later mod-users worktrees fails with ''Cannot find module react/jsx-runtime from mod-core/gui/dist/index.mjs''. Agent worked around it with a temporary out-of-tree symlink (since removed). Repair mod-core/gui/node_modules (e.g. bun install in mod-core''s real checkout) or provide the symlink for later tasks; may affect other worktrees sharing mod-core/gui/node_modules.'
    - title: Duplicate site-path safety check
      id: V6al
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:low
        - plan/phase:gui-seams
        - effort:small
      text: 'gui/src/lib/config.ts defines `isSafeSitePath()` (used for returnPath/loginPath and redirect-URL path validation and for the path written on a 401 return param) while gui/src/lib/return-path.ts defines `isSafeReturnPath()` (used by oidc-callback-page.tsx, readReturnPath and exported from index.ts). They overlap but now diverge in behaviour: isSafeSitePath lacks the colon-in-first-segment rule, so for a page like `/team:alpha/x` handleUnauthenticated appends a return value that readReturnPath (isSafeReturnPath) then rejects, and the post-login return silently becomes null. Consolidate on one predicate (writer and reader must use the same rule so any written value is readable) and keep the full existing test tables for both behaviours.'
    - title: Throwing onUnauthenticated masks the 401
      id: dYMj
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:gui-seams
        - effort:small
      text: 'gui/src/lib/config.ts `handleUnauthenticated` (~lines 262-277) calls the consumer''s `onUnauthenticated` callback unguarded. If it throws, the exception propagates out of `request()` in gui/src/lib/api.ts and replaces the intended ApiRequestError(''unauthenticated'', 401), so callers that test `err instanceof ApiRequestError && status === 401` (AuthProvider''s refreshUser and mount effect) miss the 401 branch and skip logout(). Wrap the custom handler call in try/catch (log the error) so request() still throws the 401 ApiRequestError, or call handleUnauthenticated inside try/finally in request(). Reviewer confidence: medium.'
    - title: Base URL fallbacks and redirect hardening
      id: X1dW
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:gui-seams
        - effort:small
      text: 'gui/src/lib/config.ts: (1) `getApiBaseUrl()` (~lines 172-190) validates a base URL only when set through configureUsersApi; the fallbacks `process.env.NEXT_PUBLIC_API_BASE_URL` and `window.__USERS_API_URL__` are returned with only a typeof-string check, skipping the scheme/control-character/`//` checks and trailing-slash stripping, yet request() sends the Bearer token to that base. Run them through `normalizeBaseUrl` (fall back to default or throw on rejection) or document them as trusted deploy-time inputs. (2) `unauthenticatedRedirectUrl` (~lines 100-118, 232-250) accepts any absolute http(s) URL and, when `unauthenticatedReturnParam` is set, appends the current pathname+search, so the page''s query string can be sent to a different origin. Document this, or add a pathname-only option / an allow-list for external targets. Both are defense in depth for developer-supplied config.'
    - title: LoginForm doc drift; ClientLayout loginPath
      id: uOkV
      date: "2026-10-04"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:gui-seams
        - effort:small
      text: (1) gui/src/components/login-form.tsx onSuccess doc (~lines 58-67, 141-145) says the value is already validated by isSafeReturnPath, but when the `returnPath` prop is supplied it is echoed unvalidated (`returnPath ?? readReturnPath()`); only the query-param fallback is validated. AuthPage's doc admits the echo, LoginForm's does not. Reword the doc, or validate the prop (which changes the documented explicit-value-wins contract and needs a decision). (2) gui/src/components/client-layout.tsx (~lines 36-58) builds `<AuthProvider onNavigate={onNavigate}>` with no way to pass `loginPath`, and gui/src/components/sidebar-nav.tsx (~lines 88-91) hard-codes `/auth/login`, so an app using ClientLayout with a custom login route cannot make provider logout/401 navigation or the sidebar link honour it. Add an optional `loginPath` prop to ClientLayout forwarded to AuthProvider and derive the sidebar login href from it.
