    - title: callbackLink adds the verified external iden…
      id: Nobq
      date: "2026-10-24"
      tags:
        - type:security
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/auth/oidc_flows.go
        lines: 381-434
        severity: major
        confidence: medium
        concerns: security
        description:
          callbackLink adds the verified external identity to the session principal
          through CredentialService.LinkOIDCInTx without loading the provider's
          ProviderPolicy, so ConfinedToPartyID is never set (lines 413-420). The
          just-in-time managed path does confine (createManagedUser, line 292). When
          a bring-your-own user links an identity from a provider bound to a party
          (oidc_providers.party_id set), the result is an unconfined oidc credential
          whose identity the party controls. mod_users.profile_availability_for
          (0100_baseline.sql lines 1140-1147) only restricts confined credentials.
          This credential therefore signs in to the user's personal profile and
          every other party profile, subject only to those parties' own rules.
          Departure cleanup revokes only credentials confined to the departed party
          (RevokeCredentialsConfinedToParty, credentials.sql lines 93-101). After the
          user leaves the party, the party's IdP keeps a working sign-in to the
          user's personal account. The identity model
          (mod-core docs/architecture/identity-model.md, the "Consultant with one
          Google login at three firms" row) states that a firm's own IdP identity on
          a person's principal is confined to that firm. Confidence is medium
          because the omission is a recorded, deliberate deferral (finding wZsk),
          not an oversight.
        recommendation:
          In callbackLink, call h.oauth.PolicyFor(providerID) and, when
          policy.PartyID > 0, pass ConfinedToPartyID: &policy.PartyID to
          LinkOIDCInTx, as createManagedUser does. If confinement must wait for the
          party-gating work, refuse the link for party-bound providers instead. In
          requireLinkable/checkStartGate, return 409 for a provider with a party, so
          no unconfined party-IdP credential can be created in the meantime. Add a
          route test that links via a party-bound provider and asserts the
          credential's confined_to_party_id.
    - title: platform_settings.allow_byo_identity is enfo…
      id: TrRi
      date: "2026-10-24"
      tags:
        - type:security
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/auth/anonymous.go
        lines: 39-85
        severity: major
        confidence: medium
        concerns: security
        description:
          platform_settings.allow_byo_identity is enforced only on POST
          /v1/auth/register (register.go lines 66-74) and on OIDC just-in-time
          bring-your-own creation (oidc_flows.go lines 179-185). POST
          /v1/auth/anonymous is public. It creates a guest user with no settings
          check: CreateGuestUserInTx creates a bring-your-own principal with a
          personal profile. POST /v1/me/upgrade (UserService.SelfUpgradeGuest,
          user_self_service.go lines 517-625) then turns that guest into a full
          registered user with its own person, an email identifier and a password,
          also with no allow_byo_identity check. With allow_byo_identity=false, any
          unauthenticated caller can therefore self-register a bring-your-own
          account with a personal profile. The identity model defines that setting
          as "every user managed, so no personal profile exists" (tenant-strict
          deployments, mod-core docs/architecture/identity-model.md). This gate is
          new in this change, so the bypass is introduced here, not inherited.
          Confidence is medium because a deployment might intend guests to remain
          available under tenant-strict settings. Even then, the upgrade path still
          bypasses the stated "refuses self-registration" rule.
        recommendation:
          Load GetPlatformSettings in SelfUpgradeGuest and refuse with
          ErrBYOIdentityDisabled when allow_byo_identity is false. Also decide
          whether guest creation in the Anonymous handler must be refused under the
          same setting. Guests are bring-your-own principals with personal profiles,
          so refusing is the reading consistent with the identity model. Add tests
          for both routes with allow_byo_identity=false.
