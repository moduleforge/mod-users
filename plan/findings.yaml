items:
    - title: Weak explicit JWT_SECRET beats derived key
      id: WutU
      date: "2026-10-11"
      tags:
        - type:security
        - priority:medium
        - plan/phase:derived-hmac-keys
        - effort:unspecified
      text: 'In api/internal/auth/derived_keys.go (resolveKey) and api/internal/config/config.go (JWT_SECRET read near line 388), an explicit JWT_SECRET is read via os.Getenv with no trimming or length check. Under EdDSA a whitespace-only or very short value is non-empty, so it wins over the HKDF-derived key and becomes the HMAC key for OAuth state and step-up tokens, which a caller could then forge. Before this change such a value under EdDSA was replaced by the strong DB-bootstrapped secret. Recommended: treat whitespace-only JWT_SECRET as unset (trim for the emptiness test) and/or reject an explicit secret shorter than 32 bytes under EdDSA, with a test.'
    - title: main.go step-up key comment out of order
      id: ccun
      date: "2026-10-11"
      tags:
        - type:style
        - priority:low
        - plan/phase:derived-hmac-keys
        - effort:unspecified
      text: In api/cmd/server/main.go around lines 500-511 the new step-up key resolution comment block sits inside the existing comment that ends with the consumed-JTI cache and janitor goroutine note, so the comment reads out of order. Move the stepUpKey resolution above that comment or give it its own paragraph. Also consider noting in docs/jwt-eddsa.md that an explicit JWT_SECRET collapses OAuth-state/step-up label separation (tokens stay distinguishable by structure and purpose claim).
