    - title: UserAccountService.List not on AuthorizeType
      id: 4dka
      date: "2026-10-05"
      tags:
        - type:style
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (suggestion, medium confidence; agent-authored data): UserAccountService.List in api/internal/service/user_accounts.go still calls Authorize(ctx, "list", nil). That is correct and fail-closed (wildcard-only) today and has no bypass, but it does not use the new type-level API. If type-scoped grants are introduced later, migrate List to authorizeType for consistency. No action needed now.'
    - title: docs/CLAUDE.md, next-steps.md unreachable
      id: CYCl
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (low confidence, agent-authored data; likely pre-existing and outside this phase''s diff): the link-chain check reported docs/CLAUDE.md and next-steps.md as not reachable from README.md. The same agent also reported that AGENTS.md carried no throwaway-Postgres recipe, which contradicts the merged diff, so it may have read the main checkout rather than the plan worktree; re-verify against the plan branch before acting. Fix would be linking the docs from README.md or relocating them.'
    - title: Integ harness host override skips DB guard
      id: Ap8y
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (minor, medium confidence; agent-authored data): in api/internal/authz/authz_integration_test.go, setting AUTHZ_DEV_PG_HOST skips the docker-inspect check of the shared users-module-postgres container, while resetDB still drops and recreates the fixed database authz_integ_users on whatever host/port is supplied. Nothing stops a caller pointing the override at the shared dev Postgres. Blast radius is limited to the named integ DB. Suggested: refuse the default port 5432 with an explicit host unless a confirm variable is set, or document the destructive reset.'
