    - title: Pre-existing, not introduced by the diff, bu…
      id: lvvQ
      date: "2026-10-14"
      tags:
        - type:security
        - plan/phase:stepup-code-check-constraint
        - priority:medium
        - effort:medium
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/identities.go
        lines: 587-640
        severity: minor
        confidence: medium
        concerns: security
        description:
          Pre-existing, not introduced by the diff, but activated by it. Migration 0101 makes the step-up flow reachable for the first time (the baseline CHECK rejected the insert). StepUpVerify checks a 6-digit bcrypt-hashed code with a 5-minute TTL. A wrong guess does not consume or invalidate the code, and I found no per-account attempt limit or rate limit on the verify route in api/cmd/server/main.go. An authenticated caller could guess codes in parallel inside the TTL window. Exploitation needs an authenticated, verified-email session, and the flag-gated step-up only protects credential changes.
        recommendation:
          Add a failed-attempt counter or lockout (for example, consume the code after N wrong guesses) or per-account rate limiting on /self/credential/step-up/verify. Track as a follow-up, not a blocker for this migration.
