items:
    - title: Cookie base path has no length cap
      id: rzI8
      date: "2026-10-10"
      tags:
        - type:security
        - priority:low
        - plan/phase:cookie-base-path
        - effort:unspecified
      text: 'ValidateCookieBasePath (api/internal/config/cookie_path.go) has no maximum length; an oversized operator-set USERS_COOKIE_PATH could produce an oversized Set-Cookie header that browsers silently drop. Operator-set at startup, not attacker-controlled, not exploitable. Optional: cap the length (e.g. 256 bytes) with a test.'
