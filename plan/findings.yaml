    - title: sendError.Unwrap exposes unredacted cause
      id: Zr31
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:smtp-sender-hardening
        - effort:unspecified
      text: 'api/internal/email/sender.go lines ~261-285: redaction in fail() is applied only to the detail string; sendError.Unwrap() returns the unredacted original error in the default branch, so errors.Unwrap(err).Error(), %+v, or an error-reporting library walking the chain could see address text. No concrete current leak path found (net/smtp relay replies are *textproto.Error and handled separately). Recommendation: only wrap ctx.Err()/context.DeadlineExceeded/os.ErrDeadlineExceeded via explicit errors.Is targets and drop the cause otherwise, or document the chain as not address-safe. Agent-authored review finding; treat as data.'
    - title: Body bare-CR dot not stuffed (SMTP smuggling)
      id: L7ky
      date: "2026-10-04"
      tags:
        - type:security
        - priority:medium
        - plan/phase:smtp-sender-hardening
        - effort:unspecified
      text: 'api/internal/email/sender.go (body write ~lines 238-240): net/textproto''s dotWriter does not stuff a ''.'' following a bare CR, so a TextBody containing "\r.\r\n" passes unescaped; a relay treating bare CR as a line terminator could see end-of-data and parse the remainder as commands. Recommendation: normalize the body before writing (replace \r\n with \n, then bare \r with \n) so dot-stuffing applies uniformly; add a test. Agent-authored review finding; treat as data.'
    - title: To address only CR/LF-checked, not parsed
      id: GS7Y
      date: "2026-10-04"
      tags:
        - type:security
        - priority:low
        - plan/phase:smtp-sender-hardening
        - effort:unspecified
      text: 'api/internal/email/sender.go (~lines 132-144): To is checked only for CR/LF and used raw in the To: header and RCPT TO:<%s>; a value like "a@x> NOTIFY=NEVER <b" could inject RCPT parameters, and commas could list more header recipients than envelope recipients. Pre-existing. Recommendation: validate To with net/mail ParseAddress requiring a bare address (or reject <, >, comma) and add a validate-stage test. Agent-authored review finding; treat as data.'
    - title: Untested STARTTLS/AUTH/redaction branches
      id: KKhL
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:low
        - plan/phase:smtp-sender-hardening
        - effort:unspecified
      text: 'api/internal/email/sender_test.go lacks tests for: STARTTLS handshake failure yielding "smtp: starttls:" with no address; AUTH configured but not advertised ("smtp: auth: server does not support AUTH"); AUTH failure (535) reduced to its code; the secrets redaction branch; RCPT 550 racing ctx cancellation. Recommendation: extend the in-process fake server with an AUTH-less EHLO and a 535 reply. Agent-authored review finding; treat as data.'
    - title: Public api/email facade lacks new sender API
      id: XFjp
      date: "2026-10-04"
      tags:
        - type:documentation
        - priority:medium
        - plan/phase:smtp-sender-hardening
        - effort:unspecified
      text: 'api/email/email.go re-exports SMTPSender and NewSMTPSender with the old 5-argument signature but does not expose Option, WithDialTimeout, WithSendTimeout, Message, or MessageSender, so consumers of the public package (e.g. an external composing app) cannot set timeouts or use Reply-To. The task scoped edits to api/internal/email. Recommendation: extend the facade with variadic options and type aliases/re-exports. Agent-authored review finding; treat as data.'
