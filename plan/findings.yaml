items:
    - title: Spec names wrong route for user creation
      id: Rmrc
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - effort:small
        - plan/phase:doc-updates
      text: 'Review finding (minor, high confidence; agent-authored data): docs/mod-users-spec.md, Security requirements Authorization bullet (~line 350), names the admin account-creation route as POST /v1/users; the route actually served is POST /v1/user-accounts (api/internal/handlers/account_routes.go:36). The spec already notes the /v1/users vs /v1/user-accounts drift elsewhere (~line 289), but the new sentence repeats the stale path. Fix: write POST /v1/user-accounts, or refer to creating a user account (UserAccountService.Create).'
    - title: D12 wording implies list uses AuthorizeType
      id: X5HE
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - effort:small
        - plan/phase:doc-updates
      text: 'Review finding (suggestion, medium confidence; agent-authored data): docs/architecture.md key decision D12 says type-level create/list go through AuthorizeType, but in this repo only create does (UserAccountService.Create via authorizeType). UserAccountService.List (api/internal/service/user_accounts.go) still calls Authorize(ctx, "list", nil), which is safe because a nil target is wildcard-only. Suggested: say create uses AuthorizeType and list uses a nil target, or phrase it as create/list being type-level checks that must not pass a types.id.'
