    - title: The cooldown check moved from a cheap pre-lo…
      id: Wr6I
      date: "2026-10-14"
      tags:
        - type:optimization
        - plan/phase:remediation-02
        - priority:medium
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/auth/emailcode.go
        lines: 124-137
        severity: minor
        confidence: medium
        concerns: efficiency
        description:
          The cooldown check moved from a cheap pre-lookup before code generation into the insert function, which runs after bcrypt.GenerateFromPassword (DefaultCost, tens of ms CPU). Requests inside the cooldown window (e.g. repeated unauthenticated requests for a known email) now pay a full bcrypt hash that is then discarded; previously they returned before hashing. Same pattern in identities.go sendStepUpCode (authenticated, lower exposure). Magnitude is bounded by whatever rate limiting fronts the endpoint, which was not visible in the diff.
        recommendation:
          Keep a cheap pre-check (reinstated indexed existence query for any recent code) before generating and hashing, retaining the atomic function as the authoritative guard; or accept the cost explicitly if the endpoint is rate limited upstream.
    - title: The cooldown NOT EXISTS probe now considers…
      id: 6DKr
      date: "2026-10-14"
      tags:
        - type:optimization
        - plan/phase:remediation-02
        - priority:medium
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: model/migrations/sql/0103_email_code_cooldown_function.sql
        lines: 27-39
        severity: minor
        confidence: medium
        concerns: efficiency
        description:
          The cooldown NOT EXISTS probe now considers codes of any state (including consumed), but the only email_codes index (email_codes_user_account_purpose_idx) is partial on consumed_at IS NULL, so the planner cannot use it for this predicate and will scan the table (or another index on user_account_id if any) on every code request, an unauthenticated path. Old query was covered by the partial index. Cost grows with email_codes size; expired/consumed rows are not shown to be purged.
        recommendation:
          Add a non-partial index on email_codes(user_account_id, purpose, created_at DESC) in a migration (or extend 0103) so the probe is an index lookup.
    - title: Residual online guessing budget and targeted…
      id: tCe6
      date: "2026-10-14"
      tags:
        - type:security
        - plan/phase:remediation-02
        - priority:medium
        - effort:medium
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/auth/emailcode.go
        lines: 122-160
        severity: minor
        confidence: medium
        concerns: security
        description:
          Residual online guessing budget and targeted lockout. The cooldown (60s, any state) limits new codes, but a code lives 5 minutes, so up to about 5 live codes per (user, purpose) can exist, each with its own 5-attempt budget (about 5 guesses per minute per account against a 1e6 space; unauthenticated, no per-IP or per-account lockout). Conversely an attacker can exhaust the newest code with 5 wrong guesses, and because the cooldown now counts exhausted codes the victim cannot get a fresh code for up to 60s; repeating each minute keeps email-code login denied for the victim. Atomicity itself is correct.
        recommendation:
          Consider counting failed attempts across all live codes for the (user, purpose) (or invalidating older live codes when a new one is minted), and add per-IP throttling on the public verify endpoint. Accept the lockout window as a documented tradeoff.
    - title: The function is SECURITY INVOKER (not DEFINE…
      id: f7fc
      date: "2026-10-14"
      tags:
        - type:security
        - plan/phase:remediation-02
        - priority:low
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: model/migrations/sql/0103_email_code_cooldown_function.sql
        lines: 17-43
        severity: suggestion
        confidence: medium
        concerns: security
        description:
          The function is SECURITY INVOKER (not DEFINER) so there is no privilege-escalation or search_path hijack risk, and it uses unqualified table names only. However it has no pinned search_path and keeps default PUBLIC EXECUTE, so any DB role can mint email_codes rows for arbitrary user ids through it. CREATE FUNCTION (not OR REPLACE) is non-idempotent outside goose's version tracking, which is acceptable for a goose migration.
        recommendation:
          Optionally add SET search_path = public, pg_catalog to the function and REVOKE EXECUTE ... FROM PUBLIC, granting only to the app role.
    - title: 'Pre-existing, not changed by this diff: the…'
      id: QGTV
      date: "2026-10-14"
      tags:
        - type:security
        - plan/phase:remediation-02
        - priority:low
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/handlers/auth/emailcode.go
        lines: 85-103
        severity: suggestion
        confidence: low
        concerns: security
        description:
          Pre-existing, not changed by this diff: the 200ms response floor only masks timing when work finishes within 200ms; the request handler waits on the goroutine (<-done), so slow SMTP sends for existing accounts remain a possible enumeration side channel. The new allow-list early return and cooldown skip are fast paths hidden by the same floor.
        recommendation:
          Send the email asynchronously after responding, or bound the wait to the floor.
