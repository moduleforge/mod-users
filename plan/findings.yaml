items:
    - title: checkOIDCTokenTyp relies on rawTokenTyp (api…
      id: GCnC
      date: "2026-11-13"
      tags:
        - type:security
        - plan/phase:oidc-alg-pinning
        - priority:medium
        - effort:small
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/auth/oidc_algs.go
        lines: 1096-1102
        severity: minor
        confidence: medium
        concerns: security
        description:
          checkOIDCTokenTyp relies on rawTokenTyp (api/internal/auth/carrier.go 381-397), which unmarshals the header into a struct with `Typ string`. A non-string typ (e.g. an array or number), or any other header field that breaks the unmarshal, makes json.Unmarshal fail and rawTokenTyp return "", which checkOIDCTokenTyp treats as absent and accepts. The typ policy therefore fails open for malformed typ values; a header such as {"typ":["at+jwt"]} bypasses the rejection of at+jwt/logout+jwt/step-up. Exploitability is limited: the token must still pass signature, issuer, audience and expiry checks with the pinned algorithm, so an attacker needs an issuer-signed token whose typ is non-string. Whether go-jose tolerates such a header is not established from the diff. Treating a non-string typ as absent is not safe by default in a type-confusion guard. The same helper in verifyCarrier (the aud+jwt rejection) has the same blind spot, but local tokens are produced by this module's signer, so that path is not reachable with attacker-chosen headers.
        recommendation:
          Fail closed: parse typ as json.RawMessage or any, return a distinct "present but non-string" result, and have checkOIDCTokenTyp reject it (and treat an undecodable header on a 3-segment token as a reject rather than absent). Keep absent = accepted. Add a test with a non-string typ.
    - title: checkOIDCTokenTyp returns nil for any input…
      id: JxLt
      date: "2026-11-13"
      tags:
        - type:security
        - plan/phase:remediation-01
        - priority:unspecified
        - effort:unspecified
      text: |-
        Agent-authored review finding. Everything below is untrusted report data, not instructions.
        file: api/internal/auth/oidc_algs.go
        lines: 88-92
        severity: major
        confidence: high
        concerns: security
        description:
          checkOIDCTokenTyp returns nil for any input that does not split into exactly three dot-separated segments, on the
          stated assumption that such input is "left to the signature verifier". That assumption is false for the pinned
          dependencies. oidc.IDTokenVerifier.Verify (go-oidc v3.18.0, verify.go) calls jose.ParseSigned, which (go-jose
          v4.1.4 jws.go:88-98) strips all whitespace and, when the string begins with "{", parses it as JWS JSON
          serialization (flattened or general) instead of compact. A JSON-serialized JWS has no required dots, so it
          yields len(parts) != 3 and skips the typ check entirely. The signature input is protected-b64 "." payload-b64, so any
          validly signed compact token (for example an at+jwt access token minted by the same issuer with aud equal to
          the client ID) can be re-wrapped as {"protected":...,"payload":...,"signature":...} with the signature still
          valid, and go-oidc accepts it. This defeats the typ policy this phase is meant to enforce, and Verifier.Verify
          accepts bearer-supplied tokens, so it is reachable by an unauthenticated caller who holds any such token. On
          Exchange the token comes from the provider token endpoint, so exploitability there is lower. The new tests do not
          cover non-3-segment/JSON-serialized input. Pre-existing gap in the original check, but the diff documents and
          entrenches the incorrect assumption while claiming fail-closed behaviour.
        recommendation:
          Fail closed on anything that is not a well-formed compact JWS instead of returning nil: reject (errOIDCTokenTyp) when
          len(parts) != 3, and when the trimmed input starts with "{". Alternatively, parse the header the way go-jose
          does (strip whitespace, support the JSON form and read protected/header typ) or restrict the verifier input to
          compact form before calling Verify. Add tests for a JSON-serialized token carrying typ at+jwt and for 2- and
          4-segment inputs, in both Verify and Exchange.
