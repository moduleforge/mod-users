items:
    - title: Identifier delete vs bound credentials
      id: 2yby
      date: "2026-10-23"
      tags:
        - type:conflict
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: 'The identifier-removal route (DELETE /v1/me/identifiers/{uuid}) implies hard-deleting a mod_users.user_identifiers row, but credentials are revoked and never deleted, and model/migrations/sql/0100_baseline.sql binds them with ON DELETE RESTRICT foreign keys: mod_users.cred_password.identifier_id (nullable) and mod_users.cred_email_otp.identifier_id (NOT NULL). Once an identifier has ever had a password or email-OTP credential bound to it (including the email_otp credential created automatically on verification), deleting the identifier fails with 23503 even after those credentials are revoked. The service implementing identifier removal must choose a model, for example: unbind revoked passwords (identifier_id NULL) and archive identifiers (an archived_at column, excluded from user_identifiers_kind_value_uq by a partial index) instead of deleting them, or relax cred_email_otp.identifier_id. Deleting the cred_* rows is not an option (it would orphan credentials rows of that kind). mod_users.auth_challenges.identifier_id already cascades and is not affected.'
    - title: sqlc schema lacks mod-core tables
      id: tC3F
      date: "2026-10-23"
      tags:
        - type:enhancement
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: 'model/sqlc.yaml points sqlc''s schema at ./migrations/sql only, so a query in model/queries/ that reads a mod-core relation (public.profiles, public.principals, public.entities, public.natural_persons, public.profile_policy_confirmations) fails `sqlc compile` / `make verify` with ''relation "profiles" does not exist'' (verified with sqlc v1.31.1). mod-users queries over the new mod_users schema routinely need those joins (directory summaries, profile lists, principal disable/enable, session revocation by profile). Options: add the composed mod-core migrations to the sqlc schema list (for example the schema/migrations directory `make compose` assembles, or $(SIBLINGS_DIR)/mod-core/model/migrations), or keep such reads in Go over coredb. Two related sqlc behaviors when wrapping the model/migrations/sql/0100_baseline.sql functions: a function declared RETURNS TABLE is not typed (sqlc returns interface{}), which is why mod_users.session_liveness and mod_users.credential_liveness use OUT parameters; and the TEXT[] OUT parameter amr of session_liveness is generated as pgtype.Text, so a wrapper query needs an explicit cast or a column override to get []string.'
    - title: 'Deploy manifests: signing key wiring'
      id: CLi0
      date: "2026-10-23"
      tags:
        - type:documentation
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: deploy/k8s/base/deployment.yaml and deploy/cloudrun/service.yaml still inject JWT_SECRET from a required secret (users-api-secrets/jwt-secret) and never wire JWT_SIGNING_KEY or JWT_SIGNING_KID. After the EdDSA-only change in api/internal/config (config.Load, loadJWTSigning, bootstrapSigningKeyFromDB), JWT_SECRET is optional and keys only the OAuth state HMAC (api/internal/auth/derived_keys.go OAuthStateKey), and access tokens are signed by JWT_SIGNING_KEY or, when it is unset, a key persisted in mod_users.auth_signing_keys. The manifests should make jwt-secret optional and show how to supply JWT_SIGNING_KEY (and JWT_VERIFY_PUBLIC_KEYS for rotation) from a secret, with the new AUTH_* lifetime and audience variables where a deployment needs non-default values.
    - title: Identifier delete blocked by cred FKs
      id: oi9B
      date: "2026-10-23"
      tags:
        - type:bug
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: 'model/migrations/sql/0100_baseline.sql: cred_password.identifier_id and cred_email_otp.identifier_id reference mod_users.user_identifiers(id) ON DELETE RESTRICT, and credential rows are revoked, never deleted. Once an identifier has ever had a bound password or email_otp credential (every verified email gets an email_otp), DELETE FROM user_identifiers always fails with a foreign-key violation even after the credentials are revoked, so a verified email can never be removed. api/internal/service/user_service.go RemoveIdentifierInTx revokes the bound credentials, attempts the delete inside a savepoint and returns ErrIdentifierInUse (409 users.identifier_in_use) on the 23503, rolling the revocations back. Decide whether the foreign keys should become ON DELETE SET NULL or NO ACTION with nullable columns, whether identifier removal should instead be a soft state, or whether the API surface should drop DELETE /v1/me/identifiers/{uuid} for identifiers that ever had a credential.'
closed: []
