version: 2
items:
    - title: CORS wildcard guard misses pattern entries
      id: OO6Y
      date: "2026-10-10"
      tags:
        - type:security
        - priority:high
        - plan/phase:cors-safe-default
        - effort:unspecified
      text: 'The wildcard guard in api/internal/config/config.go (~454-467) and corsOptions in api/internal/server/server.go (~59-86) only recognize the exact token *. go-chi/cors v1.2.2 also treats any CORS_ORIGINS entry containing * as a prefix/suffix wildcard pattern (e.g. https://*, http*, https://*.example.com), so outside local mode such an entry is accepted, reflects any matching origin, and sends Access-Control-Allow-Credentials: true. Docs say exact origins. Suggested: outside local mode reject any entry containing * in config.Load and make corsOptions fail closed on any entry containing *; add tests for https://* and https://*.example.com; update docs/cors.md and README to state patterns are rejected.'
    - title: Deploy manifests silently lose CORS
      id: D6o7
      date: "2026-10-10"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:cors-safe-default
        - effort:unspecified
      text: 'deploy/k8s/base/configmap.yaml (~line 25) ships DEPLOY_MODE: k8s with CORS_ORIGINS: "" which previously yielded ACAO * plus credentials and now emits no CORS headers; deploy/cloudrun/service.yaml sets no CORS_ORIGINS and hits the same default-deny. Suggested: placeholder origin with a comment in the k8s configmap (consistent with AUTH_FRONTEND_RETURN_URL) and a CORS_ORIGINS comment/entry in the Cloud Run manifest. Also docs/cors.md should state entries are bare scheme://host[:port] with no trailing slash or path, matched case-insensitively; optionally warn in config.Load on entries with a path or trailing slash.'
    - title: CORS docs still say only bare * errors
      id: BODx
      date: "2026-10-10"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:remediation-03
        - effort:unspecified
      text: .env.example (lines 14-16) says other modes reject '*' in CORS_ORIGINS at boot and docs/mod-users-spec.md:333 says a '*' in CORS_ORIGINS is a startup error; both are narrower than the behavior now, which rejects any entry containing * outside local mode. Change both to 'any entry containing *'. Fix the inaccurate comment at api/internal/server/server.go:59 together with the local-mode pattern finding.
    - title: Local CORS patterns reflect with credentials
      id: dnKQ
      date: "2026-10-10"
      tags:
        - type:security
        - priority:medium
        - plan/phase:remediation-03
        - effort:unspecified
      text: 'In DeployModeLocal, api/internal/server/server.go corsOptions (~64-90) passes pattern entries such as https://*.example.com, http* or https://* with wildcard=false, so AllowCredentials is true and go-chi/cors v1.2.2 reflects any matching Origin with Access-Control-Allow-Credentials: true. Reachable only in local mode when the operator sets the pattern explicitly; a test case blesses it and the comment ''The wildcard is never combined with credentials'' is inaccurate for it. Suggested: in local mode treat any entry containing * like the bare wildcard (collapse to ["*"], no credentials) or reject patterns in local mode; update the test and docs/cors.md. Optional: share one CORS_ORIGINS parser between config.Load and corsOptions to remove drift risk.'
