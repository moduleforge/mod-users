version: 2
items:
    - title: 'Unlink: 409 precedes identity 404'
      id: v2BM
      date: "2026-10-11"
      tags:
        - type:bug
        - plan/phase:conflicts-and-order-tests
        - priority:unspecified
        - effort:unspecified
      text: IdentitiesHandler.Unlink in api/internal/handlers/identities.go runs the last-identity count (errLastIdentity, 409 users.last_identity) before DeleteOIDCIdentityByUUID reports whether the caller's identity exists. A caller with exactly one OIDC identity and no password who sends an identity_uuid that does not exist therefore gets 409 instead of the 404 users.identity_not_found. The scope is the caller's own account, so there is no cross-user leak; the status is only misleading. Fix would be to check existence (or the delete row count) first and apply the last-identity rule only to an identity that exists. Left unchanged and pinned as the current behavior.
    - title: OIDC link insert race gives 500
      id: 8VhV
      date: "2026-10-11"
      tags:
        - type:bug
        - plan/phase:conflicts-and-order-tests
        - priority:unspecified
        - effort:unspecified
      text: OIDCHandler.handleLinkMode in api/internal/handlers/auth/oidc.go checks GetOIDCIdentityByIssuerSubject and redirects with identity_in_use when the (issuer, subject) pair belongs to another account, but the later insert in the same function is not guarded against the UNIQUE (issuer, subject) constraint. Two concurrent link callbacks for the same pair make the loser hit a 23505 and answer a JSON 500 internal_error instead of the identity_in_use redirect. Fix would be to match the unique violation on that constraint name (errors.As plus ConstraintName) and take the same redirect path. Not changed here.
