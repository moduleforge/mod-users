    - title: Managed JIT user creation duplicates service
      id: ApCx
      date: "2026-10-23"
      tags:
        - type:enhancement
        - plan/phase:users-identity-core
        - priority:unspecified
        - effort:unspecified
      text: api/internal/handlers/auth/oidc_flows.go createManagedUser re-implements the entity, principal, users-row and party-profile steps of service.UserService.CreateManagedUserInTx because that primitive authorizes `create user` as an acting profile, and the OIDC callback has no actor before the new idp_jit profile exists. Add a trusted service primitive (for example CreateManagedJITUserInTx on UserService) that creates the managed user with its active idp_jit party profile and observes `create user` as that profile, then switch createManagedUser to it so the invariants live in one place. The managed path was written without a live database to exercise it.
