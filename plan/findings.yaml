version: 2
items:
    - title: Handler signer injection is opt-in only
      id: QI2I
      date: "2026-10-10"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:eddsa-verify-only-key
        - effort:unspecified
      text: 'Handler.jwtSigner() in api/internal/handlers/auth/register.go and AssumeHandler in api/internal/handlers/assume.go fall back to an HS256 signer keyed by jwtSecret when SetSigner was never called, so a composing app that builds these handlers itself under JWT_ALG=EdDSA mints HS256 tokens that the EdDSA-pinned verifier rejects (login 401, nothing flagged at startup). Fails closed, no forgery. The OIDC callback (oidc.go) builds its own Signer via NewSigner(cfg.LocalAuth) per request, a different wiring path. Suggested: document the required SetSigner(auth.NewSigner(cfg.LocalAuth)) wiring in docs/jwt-eddsa.md, or add constructor variants taking a Signer; consider failing when no signer is set and JWT_ALG is not HS256; consider rejecting an empty secret in NewHS256Signer; consider building the OIDC Signer once at construction.'
    - title: Step-up tokens share JWT_SECRET with bearer
      id: nIyL
      date: "2026-10-10"
      tags:
        - type:security
        - priority:medium
        - plan/phase:eddsa-verify-only-key
        - effort:unspecified
      text: 'In HS256 mode, IssueStepUpToken/VerifyStepUpToken (api/internal/handlers/identities.go) use the same JWT_SECRET as local bearer tokens verified in api/internal/auth/jwt.go verifyLocal, with no typ or audience separation. A step-up token whose iss and exp match the local verifier''s check could be accepted as a bearer token; the claims were not traced. EdDSA mode removes this for bearer verification since HS256 is rejected there. Suggested: confirm step-up claims cannot satisfy the issuer check, or key step-up tokens with a derived or separate key, or add typ/aud separation.'
    - title: Document JWT_VERIFY_PUBLIC_KEYS revocation
      id: RmRX
      date: "2026-10-10"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:eddsa-verify-only-key
        - effort:unspecified
      text: Under JWT_ALG=HS256, NewLocalVerifier in api/internal/auth/jwt.go still accepts EdDSA tokens for every key left in JWT_VERIFY_PUBLIC_KEYS, so a retired key stays authorized until removed. docs/jwt-eddsa.md should state that removing a key from JWT_VERIFY_PUBLIC_KEYS is what revokes it, including after reverting to HS256.
    - title: Step-up tokens accept an empty secret
      id: SUyS
      date: "2026-10-10"
      tags:
        - type:security
        - priority:medium
        - plan/phase:remediation-01
        - effort:unspecified
      text: 'IssueStepUpToken and VerifyStepUpToken (api/internal/handlers/identities.go ~618, 659; api/internal/auth/stepup.go) accept an empty jwtSecret with no guard; an IdentitiesHandler or SSHKeysHandler built with an empty secret would let anyone forge valid step-up tokens (HMAC with empty key). Pre-existing; the signer/verifier paths gained empty-secret guards but the step-up path did not. Suggested: return an error when len(secret)==0 in both functions; consider a dedicated step-up key derived from the secret via HKDF with a context label so bearer and step-up keys are separated cryptographically, and optionally allowlist typ (empty or JWT) for bearer tokens in verifyLocal in api/internal/auth/jwt.go.'
