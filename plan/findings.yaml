version: 2
items:
    - title: EmailCodePage wrong code hits 401 redirect
      id: ljyL
      date: "2026-10-04"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: gui/src/lib/api.ts request() converts every 401 into ApiRequestError('unauthenticated','Authentication required') and, without skipAuthRedirect, clears the token and hard-redirects to the login URL. The backend returns 401 for a wrong/expired email code, so EmailCodePage (and likely login with a wrong password) redirects instead of showing "invalid or expired code". The new VerifyEmailPage avoids it via skipAuthRedirect; EmailCodePage and the login call are untouched by this plan.
    - title: 'ENVIRONMENT: mod-core/gui/node_modules contai'
      id: ZNOd
      date: "2026-10-04"
      tags:
        - type:ambiguity
        - plan/phase:gui-seams
        - priority:unspecified
        - effort:unspecified
      text: 'ENVIRONMENT: mod-core/gui/node_modules contains dangling relative symlinks (e.g. react, tsup -> ../../../users-gui-integration-seams-01-001/node_modules/.bun/...) written by the task worktree provisioning install (known worktree-symlink gap in AGENTS.md). Without a fix, bun test in later mod-users worktrees fails with ''Cannot find module react/jsx-runtime from mod-core/gui/dist/index.mjs''. Agent worked around it with a temporary out-of-tree symlink (since removed). Repair mod-core/gui/node_modules (e.g. bun install in mod-core''s real checkout) or provide the symlink for later tasks; may affect other worktrees sharing mod-core/gui/node_modules.'
    - title: Duplicate site-path safety check
      id: V6al
      date: "2026-10-04"
      tags:
        - type:optimization
        - priority:medium
        - plan/phase:gui-seams
        - effort:unspecified
      text: 'gui/src/lib/config.ts defines `isSafeSitePath()` (used for returnPath/loginPath and redirect-URL path validation and for the path written on a 401 return param) while gui/src/lib/return-path.ts defines `isSafeReturnPath()` (used by oidc-callback-page.tsx, readReturnPath and exported from index.ts). They overlap but now diverge in behaviour: isSafeSitePath lacks the colon-in-first-segment rule, so for a page like `/team:alpha/x` handleUnauthenticated appends a return value that readReturnPath (isSafeReturnPath) then rejects, and the post-login return silently becomes null. Consolidate on one predicate (writer and reader must use the same rule so any written value is readable) and keep the full existing test tables for both behaviours.'
