items:
    - title: jwtsecret integ test hard-codes 5432
      id: R9KP
      date: "2026-10-05"
      tags:
        - type:enhancement
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Test gap: api/internal/config/jwtsecret_bootstrap_integration_test.go hard-codes port 5432 and the users-module-postgres container name, so it cannot run against a throwaway Postgres container on a shared Docker host. It lacks the AUTHZ_DEV_PG_PORT / explicit-host override that api/internal/authz/authz_integration_test.go now has.'
    - title: authorizeType fallback ignores typeID guard
      id: 5pBA
      date: "2026-10-05"
      tags:
        - type:security
        - priority:high
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (suggestion, medium confidence; agent-authored data): in api/internal/service/user_accounts.go the authorizeType fallback for a non-TypeAuthorizer calls Authorize(ctx, op, nil) and ignores typeID, so the typeID <= 0 fail-closed guard does not apply on that path, and the nil-target wildcard-only property holds only for mod-users'' own Authorizer. Not exploitable today: production wires the concrete Authorizer and typeID comes from IDForSlugMust. Optional hardening: return ErrForbidden when typeID <= 0 in the fallback, or require a TypeAuthorizer at construction so a decorated Authorizer fails loudly. Escalation (quoted data): no remediation budget was available when this finding was evaluated (the server returned no budget block, so the evaluator treated it as exhausted); internal escalation is off, so the question "promote to the backlog at priority:high, or dismiss?" is surfaced to the user. Recommended option: promote (small, local fix).'
    - title: UserAccountService.List not on AuthorizeType
      id: 4dka
      date: "2026-10-05"
      tags:
        - type:style
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (suggestion, medium confidence; agent-authored data): UserAccountService.List in api/internal/service/user_accounts.go still calls Authorize(ctx, "list", nil). That is correct and fail-closed (wildcard-only) today and has no bypass, but it does not use the new type-level API. If type-scoped grants are introduced later, migrate List to authorizeType for consistency. No action needed now.'
    - title: docs/CLAUDE.md, next-steps.md unreachable
      id: CYCl
      date: "2026-10-05"
      tags:
        - type:documentation
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (low confidence, agent-authored data; likely pre-existing and outside this phase''s diff): the link-chain check reported docs/CLAUDE.md and next-steps.md as not reachable from README.md. The same agent also reported that AGENTS.md carried no throwaway-Postgres recipe, which contradicts the merged diff, so it may have read the main checkout rather than the plan worktree; re-verify against the plan branch before acting. Fix would be linking the docs from README.md or relocating them.'
    - title: Integ harness host override skips DB guard
      id: Ap8y
      date: "2026-10-05"
      tags:
        - type:bug
        - priority:low
        - effort:small
        - plan/phase:type-target-authorization
      text: 'Review finding (minor, medium confidence; agent-authored data): in api/internal/authz/authz_integration_test.go, setting AUTHZ_DEV_PG_HOST skips the docker-inspect check of the shared users-module-postgres container, while resetDB still drops and recreates the fixed database authz_integ_users on whatever host/port is supplied. Nothing stops a caller pointing the override at the shared dev Postgres. Blast radius is limited to the named integ DB. Suggested: refuse the default port 5432 with an explicit host unless a confirm variable is set, or document the destructive reset.'
