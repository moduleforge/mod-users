        - plan/slug:users-action-required-migration
        - type:ambiguity
        - priority:unspecified
        - effort:unspecified
      text: '[phase-01-go-action-required-migration architecture-conformance gate, arch-review-002] api/cmd/server/main.go''s field-cipher init call was forced from fieldcrypto.NewFromEnv() to fieldcrypto.NewFromEnvOrGenerate(ctx, coredb.New(pool)) in task 001, because NewFromEnv no longer exists in the sibling mod-core/api/fieldcrypto package (confirmed: only NewFromKey and the moduleforge.module.yaml-pinned NewFromEnvOrGenerate remain) — a forced adaptation to an upstream interface removal, not a discretionary choice by this plan. The stale doc comment describing the old fail-fast-on-missing-key behavior has been corrected (see commit ead0baa on plan/users-action-required-migration). Worth separate awareness/review: the security posture for SSN/EIN field-encryption key provisioning has shifted repo-wide from fail-fast-if-missing to auto-generate-if-absent, as a side effect of mod-core''s own interface consolidation (not something mod-users controls or chose). Not blocking this plan; flagging for whoever owns key-management/security policy to confirm this is the intended posture.'
