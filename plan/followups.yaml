    - title: details[] shape not runtime-validated
      id: L92R
      date: "2026-07-16"
      tags:
        - type:security
        - priority:unspecified
        - effort:unspecified
        - plan/phase:gui-core-gui-adoption
      text: 'Phase-03 security review (users-apiresp-migration plan) found: gui/src/lib/api.ts''s request() casts the parsed error JSON body directly to ApiErrorResponse and assigns errorBody.error.details straight into errorDetails: FieldErrorData[] | undefined with no runtime check that details is actually an array or that its elements have field/message as strings. Low-confidence, suggestion-level, non-blocking: not an XSS/injection risk (JSX children are always text-escaped, no dangerouslySetInnerHTML anywhere in @moduleforge/core-gui or mod-users/gui), but a malformed/unexpected-shape body could make React throw at render time ("Objects are not valid as a React child") in <FieldError>/<ErrorBanner>. Mirrors an existing pattern already in @moduleforge/core-gui''s own canonical request() (gui/src/lib/api-client.ts in mod-core), so this diff doesn''t introduce a new risk class - just extends an existing accepted trust assumption. Optional hardening: validate/coerce details shape after parsing so a malformed envelope degrades to "no field details" instead of crashing.'
    - title: shadow-db-lint missing cross-module prereqs
      id: LnMH
      date: "2026-07-19"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'Discovered while fixing followup DQU4 (Docker networking in model/scripts/shadow-db-lint.sh): after fixing the networking issue (script now connects via a published host port instead of an unreachable Docker Desktop bridge IP), `make lint.model` still fails — but for a distinct, pre-existing reason: goose errors on `0100_schema.sql` with `relation "legal_entities" does not exist (SQLSTATE 42P01)`. mod-users'' migrations declare `after: [core]` (AGENTS.md:108) because they FK into mod-core''s `legal_entities`/`apps` tables, but shadow-db-lint.sh only applies model/migrations against a bare empty Postgres — it has no mechanism to provision mod-core''s prerequisite schema first. Confirmed present on main (same file/lines) and not addressed by .github/workflows/ci.yml''s lint job either (which only checks out mod-core/gui for yalc, not mod-core''s migrations) — so `make lint` likely fails in CI today for this same reason, unrelated to the networking bug just fixed. Needs a decision: should shadow-db-lint stitch in cross-module prerequisite migrations per the manifest''s migrations.after ordering, or should this validation gap be handled another way (e.g. a documented known-limitation, or CI-level orchestration)?'
