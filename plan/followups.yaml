    - title: api/openapi.yaml missing identities surface
      id: biJk
      date: "2026-07-20"
      tags:
        - type:documentation
        - plan/phase:route-wiring
        - priority:unspecified
        - effort:unspecified
      text: '[phase-01-route-wiring architecture-conformance gate] api/openapi.yaml (AGENTS.md''s designated "authoritative REST API specification") has zero hits for identities/credential/step-up — the identity/credential self-service surface (list/link/unlink OIDC identities, set/remove password, step-up request/verify) now wired into moduleforge.module.yaml is undocumented there. Pre-existing gap (the endpoints already existed hand-wired in main.go before this plan), not introduced or worsened by phase-01, and explicitly out of this plan''s Phase 2 doc-update scope (docs/architecture.md + docs/mod-users-spec.md only). Recommend a follow-up task to add these endpoints to openapi.yaml.'
