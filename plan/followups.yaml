    - title: 5 flat-envelope sites deferred
      id: eiF8
      date: "2026-07-14"
      tag: users-apiresp-migration
      text: '[users-apiresp-migration planning] The apiresp-migration plan''s Go vocab migration (phase-02) deliberately excludes 5 sites that use server.JSON directly to emit bespoke, non-standard flat response bodies rather than going through the standard error trio: api/internal/auth/require_verified.go:24,34 (internal_error flat, email_unverified), require_confirmed.go:36 (oidc_not_confirmed, drives an auth-flow redirect), and identities.go:626 (step_up_required, carries an extra challenge_path field), :646 (last_identity). These are the module''s most non-conformant sites, but migrating them to the standard nested envelope is a breaking change to consuming apps'' GUI code (app-mfdemo/app-mftodo), which keys off these bespoke shapes directly (confirmed: writeStepUpRequired''s own comment says the GUI reads error as a string). Deferred as an explicit follow-up rather than expanding this plan''s scope into a coordinated cross-repo GUI change. Recommend a dedicated future plan spanning mod-users + the consuming apps'' GUI code once this migration''s core scope has landed and the pattern for coordinated cross-repo breaking changes is established.'
    - title: Pre-existing doc-graph orphans (not from ph1)
      id: rmQ5
      date: "2026-07-16"
      tag: go-apiresp-foundation
      text: 'Phase-01 boundary review''s link-chain check (README-rooted reachability) found several project docs not reachable from README.md: api/server/CLAUDE.md, deploy/k8s/README.md, deploy/local/README.md, deploy/serverless/README.md, model/README.md, next-steps.md (plan/*.md, .flow/binding.md, and CLAUDE.md files under plan/ are expected exclusions — transient plan artifacts / agent-context files, not persistent project documentation). None of these orphaned files were touched by phase-01''s diff (which only touched api/*.go, plan/TODO.yaml, plan/followups.yaml, and the phase-01 task doc), so this predates this plan and is not a regression it introduced. No broken links were found otherwise (a python link-checker script; one run produced false-positive broken links for docs/architecture.md and docs/mod-users-spec.md''s ./mf-standards/... links, but a clean re-run confirmed those targets exist and resolve fine). Recommend a manager/tech-writer pass to either link these orphans from README.md (if they should be part of the discoverable doc graph) or confirm they''re intentionally out-of-band (e.g. deploy runbooks meant to be found by directory browsing, not README links).'
    - title: apiresp needs public Conflict() constructor
      id: ZVum
      date: "2026-07-16"
      tag: go-apiresp-foundation
      text: 'Phase-01 architecture-conformance review (users-apiresp-migration plan) found: writeServiceError''s svc.ErrEmailTaken branch (api/internal/handlers/user_accounts.go) bypasses apiresp.WriteError and hand-constructs the 409 conflict envelope directly via apiresp.WriteJSON/Envelope/ErrorBody, including a literal message string ("the request conflicts with the current state") that duplicates apiresp''s own unexported publicMessage("conflict") output verbatim. This is a documented, justified stopgap: mod-core/api/apiresp exposes InvalidInput(...) as a public detail-carrying constructor but no equivalent for ErrConflict, so there''s no way to delegate fully to apiresp.WriteError while still attaching the users.email_taken field detail. Recommend a fast-follow on mod-core''s apiresp package (cross-repo, not fixable from mod-users) to add a public constructor (e.g. apiresp.Conflict(details ...FieldError) error, mirroring InvalidInput), which would let writeServiceError collapse fully onto apiresp.WriteError(w, r, err) with no local envelope construction, and remove the message-text duplication/drift risk.'
