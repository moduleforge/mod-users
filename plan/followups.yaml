    - title: ErrorBanner drops AlertCircle icon vs old UI
      id: ygBr
      date: "2026-07-16"
      tag: gui-core-gui-adoption
      text: 'Phase-03 architecture-conformance review (users-apiresp-migration plan) found: gui/src/components/error-message.tsx''s delegation to core-gui''s <ErrorBanner error={message} /> drops the AlertCircle icon the old hand-rolled Alert/AlertDescription markup rendered. Not a functional defect (null/non-null contract parity confirmed exact), and adopting the shared widget is the correct move per the task doc - but it''s core-gui''s own widget design, not something mod-users should independently patch. Worth a quick manual/Ladle visual check if icon presence in destructive banners matters to the design system; if so, raise with whoever owns @moduleforge/core-gui''s ErrorBanner component.'
    - title: details[] shape not runtime-validated
      id: L92R
      date: "2026-07-16"
      tag: gui-core-gui-adoption
      text: 'Phase-03 security review (users-apiresp-migration plan) found: gui/src/lib/api.ts''s request() casts the parsed error JSON body directly to ApiErrorResponse and assigns errorBody.error.details straight into errorDetails: FieldErrorData[] | undefined with no runtime check that details is actually an array or that its elements have field/message as strings. Low-confidence, suggestion-level, non-blocking: not an XSS/injection risk (JSX children are always text-escaped, no dangerouslySetInnerHTML anywhere in @moduleforge/core-gui or mod-users/gui), but a malformed/unexpected-shape body could make React throw at render time ("Objects are not valid as a React child") in <FieldError>/<ErrorBanner>. Mirrors an existing pattern already in @moduleforge/core-gui''s own canonical request() (gui/src/lib/api-client.ts in mod-core), so this diff doesn''t introduce a new risk class - just extends an existing accepted trust assumption. Optional hardening: validate/coerce details shape after parsing so a malformed envelope degrades to "no field details" instead of crashing.'
    - title: Design doc/core-gui FieldError naming drift
      id: 8oow
      date: "2026-07-16"
      tag: gui-core-gui-adoption
      text: 'Phase-03 architecture-conformance review (users-apiresp-migration plan) found: docs/mf-standards/architecture/api-response-design.md''s "Widget set implied" wire-type block names the interface FieldError, but the actual shipped @moduleforge/core-gui export is FieldErrorData (the plain name FieldError is taken by the <FieldError> component). mod-users'' Phase 3 diff correctly follows the actual shipped name consistently - no local mismatch was introduced. This naming drift is inherited from Wave 0/core-gui itself and predates this plan; cross-repo, needs reconciling in docs-mf-standards (update the design doc''s example to FieldErrorData) or on the core-gui side, not fixable from mod-users.'
