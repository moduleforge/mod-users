    - title: Nested worktrees break go.mod replace paths
      id: 3atD
      date: "2026-07-16"
      tag: fix-emailcode-enumeration-message
      text: '[ad-hoc task: fix-emailcode-enumeration-message] api/go.mod''s replace directives (../../mod-core/{api,model}, ../../mod-audit/*, ../../mod-authz/*) resolve correctly from the main mod-users checkout but not from a worktree nested under mod-users/worktrees/ (one level deeper), causing go build/go test to fail out of the box in any such worktree. Confirmed pre-existing and reproducible in an unrelated sibling worktree (2026-07-17-followup-cleanup), not caused by this task''s edit. Worked around by creating symlinks at mod-users/worktrees/{mod-core,mod-audit,mod-authz} -> the real sibling repos under /Users/zane/playground/moduleforge/ (outside the task worktree, no tracked files touched). Related to existing followup 9EBV (go.work replace-conflict fix) but distinct: this is about relative ../../ path depth breaking entirely for any nested worktree, not just go.work usage. Recommend documenting the symlink (or equivalent) step in AGENTS.md''s "Working in worktrees" section, alongside the existing .yalc/ and .env steps, so future nested-worktree tasks don''t rediscover this.'
    - title: Two rebuild-failure sites in oidc_providers.g
      id: Z6Vf
      date: "2026-07-17"
      tag: centralize-server-error
      text: '[phase-01-centralize-server-error/002-migrate-oidc-handlers.md] Two rebuild-failure sites in oidc_providers.go now carry an id field in the wrapped error even though the original slog.ErrorContext call at that exact site didn''t log one — purely additive diagnostic context within the same line being edited, not a scope change.'
    - title: No lint guardrail vs server.Error drift
      id: Wkx3
      date: "2026-07-17"
      tag: centralize-server-error
      text: 'Phase-01 architecture-conformance review (centralize-server-error plan) found: this phase collapsed 92 of 96 literal server.Error/server.ErrorWithDetails call sites onto apiresp.WriteError, but nothing (lint rule, forbidigo/staticcheck config, CI check) prevents a newly-added handler from reintroducing a literal server.Error/server.ErrorWithDetails call outside the four documented carve-outs (oidc_providers.go:222, identities.go:310/389/407). The invariant this phase established is enforced by convention and this one-time sweep, not tooling, so it can silently erode — including in the already-known handlers/auth/*.go files (followup biPE, ~10+ of its own literal sites) once that migration happens. Recommend adding a forbidigo pattern (or equivalent) banning server.Error(/server.ErrorWithDetails( outside an explicit allowlist of the four carve-out lines, wired into make lint, so any future literal site fails CI instead of silently drifting back.'
    - title: Carve-out grep check is comment-fragile
      id: 6vir
      date: "2026-07-17"
      tag: centralize-server-error
      text: 'Phase-01 architecture-conformance review (centralize-server-error plan) found: task 003''s completion-check (grep -n "server\.Error\|server\.ErrorWithDetails" identities.go, expecting exactly 3 matches for the carve-out call sites) required deliberately wording the carve-out justification comments to avoid literally containing the substring server.ErrorWithDetails, so the comment text wouldn''t inflate the grep count. This is a brittle verification method (grepping comment text) rather than a structural one, and a future edit to a carve-out comment could reintroduce the substring and desync the count from reality. If this carve-out pattern is reused for a future site-migration batch, use a call-site-anchored grep (e.g. matching only server\.Error(With)?Details?\(w, at line-start) instead of a raw substring match that comments can accidentally collide with.'
