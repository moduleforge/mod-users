      text: 'go.work workaround documented in follow-up oyo6/building-common.md assumes single-level worktree nesting; this task''s worktree is double-nested (task worktree carved from a plan worktree) and needed additional go work edit -replace overrides for 6 cross-module deps beyond plain go work use. Worth a doc update / new follow-up so future doubly-nested task worktrees in this repo don''t rediscover it. (Confirmed reproducible: a second task in the same plan hit and resolved it identically, using 5 "../" plus explicit -replace overrides each qualified with @v0.0.0 to avoid a "replaced at all versions" error — this is a stable, repeatable recipe for the doubly-nested case, not a one-off.)'
