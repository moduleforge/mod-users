        description:
          The impersonation_ended event starts restoreAdministrator, whose committed token_response triggers loadUser (new session uuid) while logout continues to revoke and then clears state. A loadUser response landing after logout's setUser(null) could repopulate the user record in memory after sign-out. Local storage is cleared (no token or marker leak; later session.get is skipped because the stored token is null).
        recommendation:
          Guard loadUser/setUser with a signed-out check (the session ref) so a late response after logout is discarded.
