    - title: SSH-key label allows control/bidi chars
      id: GrC7
      date: "2026-09-28"
      tags:
        - type:security
        - plan/phase:phase-01-ssh-public-keys
        - plan/slug:ssh-public-keys
        - priority:low
        - effort:small
      text: '[phase-01 gate, security-002, minor] NormalizeLabel (api/internal/sshkey/label.go) only bounds length, not content: a caller-supplied label containing NUL, other control chars, or Unicode bidi overrides passes validation, and NUL then causes Postgres to reject the INSERT as a 500 instead of a 400. Stored control/bidi chars are echoed in API responses and audit snapshots (a display-spoofing vector). Reject unicode.IsControl runes and bidi formatting chars (U+202A-U+202E, U+2066-U+2069) in caller-supplied labels with a new 400 detail code; strip (don''t reject) them from comment-derived default labels. Add table-driven test cases (NUL, newline, U+202E).'
